# =============================================================================
# Create Monthly Improvement Branches
#
# What it does:
#   For every non-archived repository in the organization that has had a pull
#   request merged into `main` within the last 30 days, this workflow creates
#   the current month's improvement branch (e.g. 2026-09-september-improvements)
#   off the tip of `main`. Those branches are later turned into pull requests by
#   the "Monthly Branch Improvement Sync" workflow, and reported on by the
#   "Github Repos Reporter" workflow (called as a second job here).
#
# Guard rail & override:
#   By default this only runs within the first 5 days of the month, so branches
#   are named for — and cut from — the correct monthly cycle. To run later in
#   the month, dispatch it with the "force_run" input enabled to override the
#   guard.
#
# Structure (validations separated from implementation):
#   Job 1 - create-improvement-branches
#     Step "Validate ..."  -> validation + target branch calculation only
#     Step "Create ..."    -> repository processing / branch creation only
#     Step "Write ..."     -> execution summary
#   Job 2 - report-repos   -> calls the reusable "Github Repos Reporter"
#
# Trigger: manual (workflow_dispatch). A monthly schedule is provided but
#          disabled below.
# =============================================================================

name: Create Monthly Improvement Branches
run-name: Create monthly improvement branches${{ inputs.force_run && ' (forced run)' || '' }}

permissions:
  # Superset of what the reusable reporter job declares, so its permissions are
  # not capped when called. Actual GitHub writes use the ORG_LEVEL_TOKEN PAT.
  actions: read
  contents: read
  pull-requests: read

on:
  # schedule:
  #   # Runs at 00:00 on the 1st of every month to catch the previous month's branch
  #   - cron: "0 0 1 * *"
  workflow_dispatch: # Allows manual testing and execution
    inputs:
      force_run:
        description: "Override the 'first 5 days of the month' guard and run anyway"
        required: false
        type: boolean
        default: false

jobs:
  create-improvement-branches:
    name: Create improvement branches
    runs-on: ubuntu-latest
    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout repo
        uses: actions/checkout@v6.0.2

      - name: Make logger readable
        run: chmod +r .github/scripts/logging.sh || true

      # ---------------------------------------------------------------------
      # VALIDATION ONLY (implements TODO: "validations in one step")
      # Verifies the run window (with override) and computes the target branch.
      # No repositories are touched here.
      # ---------------------------------------------------------------------
      - name: Validate run window & compute target branch
        id: vars
        shell: bash
        run: |
          set -Eeuo pipefail
          source "${GITHUB_WORKSPACE}/.github/scripts/logging.sh"

          echo "::group::Validate run window"
          FORCE_RUN="${{ inputs.force_run }}"
          CURRENT_DAY=$(date +%d | sed 's/^0*//') # Strip leading zeros
          log INFO "Current day of month: ${CURRENT_DAY} (force_run=${FORCE_RUN})"

          if [ "$CURRENT_DAY" -gt 5 ]; then
            if [ "$FORCE_RUN" = "true" ]; then
              log WARN "Past the first 5 days of the month, but force_run=true — continuing."
            else
              log ERROR "This workflow only runs within the first 5 days of the month."
              log ERROR "Re-run with the 'force_run' option enabled to override this guard."
              exit 1
            fi
          fi
          echo "::endgroup::"

          echo "::group::Compute target branch name"
          BASE_DATE=$(date +%Y-%m-%B)
          YEAR=$(echo "$BASE_DATE" | cut -d'-' -f1)
          MONTH_NUM=$(echo "$BASE_DATE" | cut -d'-' -f2)
          MONTH_NAME=$(echo "$BASE_DATE" | cut -d'-' -f3 | tr '[:upper:]' '[:lower:]')
          BRANCH_NAME="${YEAR}-${MONTH_NUM}-${MONTH_NAME}-improvements"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
          log INFO "Target branch for this run: ${BRANCH_NAME}"
          echo "::endgroup::"

      # ---------------------------------------------------------------------
      # IMPLEMENTATION ONLY (implements TODO: "implementation other step"
      # and TODO: "simplify this workflow execution")
      # Creates the target branch in every eligible repository.
      # ---------------------------------------------------------------------
      - name: Create improvement branches for active repos
        id: process
        env:
          GH_TOKEN: ${{ secrets.ORG_LEVEL_TOKEN }}
          BRANCH_NAME: ${{ steps.vars.outputs.branch_name }}
          ORG_NAME: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source "${GITHUB_WORKSPACE}/.github/scripts/logging.sh"

          # Eligibility cutoff: only repos with a merge to main newer than this.
          # (Previously referenced but never defined, so the 30-day skip never worked.)
          THIRTY_DAYS_AGO=$(date -d '30 days ago' +%s)

          CREATED=0
          SKIPPED_NO_MERGE=0
          SKIPPED_STALE=0
          SKIPPED_EXISTS=0

          echo "::group::List candidate repositories"
          log INFO "Listing non-archived repositories for ${ORG_NAME}"
          REPOS=$(gh repo list "$ORG_NAME" --limit 1000 --no-archived --json name --jq '.[].name')
          echo "::endgroup::"

          # Here-string (not a pipe) so counters survive in the current shell.
          while IFS= read -r REPO; do
            [ -z "$REPO" ] && continue
            echo "::group::${ORG_NAME}/${REPO}"

            # 1. Skip repos with no recent merge to main.
            LAST_MERGED=$(gh pr list -R "$ORG_NAME/$REPO" --state merged --base main --limit 1 --json mergedAt --jq '.[0].mergedAt' 2>/dev/null || echo "")
            if [ -z "$LAST_MERGED" ]; then
              log INFO "No merged PRs into main. Skipping."
              SKIPPED_NO_MERGE=$((SKIPPED_NO_MERGE + 1))
              echo "::endgroup::"
              continue
            fi

            MERGE_SEC=$(date -d "$LAST_MERGED" +%s)
            if [ "$MERGE_SEC" -lt "$THIRTY_DAYS_AGO" ]; then
              log WARN "Most recent merge to main is older than 30 days. Skipping."
              SKIPPED_STALE=$((SKIPPED_STALE + 1))
              echo "::endgroup::"
              continue
            fi

            # 2. Skip repos where the target branch already exists.
            #    (Previously this only logged and then created the branch anyway.)
            if gh api -H "Accept: application/vnd.github+json" \
                 "repos/$ORG_NAME/$REPO/branches/$BRANCH_NAME" >/dev/null 2>&1; then
              log WARN "Branch ${BRANCH_NAME} already exists. Skipping."
              SKIPPED_EXISTS=$((SKIPPED_EXISTS + 1))
              echo "::endgroup::"
              continue
            fi

            # 3. Create the branch from the tip of main.
            MAIN_SHA=$(gh api "repos/$ORG_NAME/$REPO/git/ref/heads/main" --jq '.object.sha' 2>/dev/null || echo "")
            if [ -z "$MAIN_SHA" ]; then
              log ERROR "Could not fetch main branch SHA for ${REPO}. Skipping."
              echo "::endgroup::"
              continue
            fi

            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$ORG_NAME/$REPO/git/refs" \
              -f ref="refs/heads/$BRANCH_NAME" \
              -f sha="$MAIN_SHA" \
              --silent
            log INFO "Successfully created branch ${BRANCH_NAME} in ${REPO}."
            CREATED=$((CREATED + 1))
            echo "::endgroup::"
          done <<< "$REPOS"

          log INFO "Completed monthly branch creation."
          log INFO "created=${CREATED} skipped_no_merge=${SKIPPED_NO_MERGE} skipped_stale=${SKIPPED_STALE} skipped_exists=${SKIPPED_EXISTS}"

          # Expose counts for the execution summary step.
          {
            echo "created=${CREATED}"
            echo "skipped_no_merge=${SKIPPED_NO_MERGE}"
            echo "skipped_stale=${SKIPPED_STALE}"
            echo "skipped_exists=${SKIPPED_EXISTS}"
          } >> "$GITHUB_OUTPUT"

      - name: Write execution summary
        if: always()
        env:
          BRANCH_NAME: ${{ steps.vars.outputs.branch_name }}
        shell: bash
        run: |
          {
            echo "## Create Monthly Improvement Branches"
            echo ""
            echo "Creates the current month's improvement branch in every non-archived"
            echo "organization repository that has had a PR merged into \`main\` within the"
            echo "last 30 days. These branches are later converted into PRs by the"
            echo "**Monthly Branch Improvement Sync** workflow."
            echo ""
            echo "### Run details"
            echo ""
            echo "- Target branch: \`${BRANCH_NAME:-not computed (validation failed)}\`"
            echo "- Force run (override 5-day guard): \`${{ inputs.force_run }}\`"
            echo ""
            echo "### Results"
            echo ""
            echo "| Metric | Count |"
            echo "| --- | --- |"
            echo "| Branches created | ${{ steps.process.outputs.created || '0' }} |"
            echo "| Skipped — no merge into main | ${{ steps.process.outputs.skipped_no_merge || '0' }} |"
            echo "| Skipped — last merge older than 30 days | ${{ steps.process.outputs.skipped_stale || '0' }} |"
            echo "| Skipped — branch already exists | ${{ steps.process.outputs.skipped_exists || '0' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Second job: report on all repos by reusing the "Github Repos Reporter"
  # workflow. Runs after branches are created so the report reflects them.
  report-repos:
    name: Report repositories
    needs: create-improvement-branches
    uses: ./.github/workflows/orchestrator-reporter.yml
    secrets: inherit
    with:
      full_report: true
