name: "Report Repos"
description: "Reports across repositories in an organization"
inputs:
  repo_filter:
    description: "Optional substring to filter repositories (case-insensitive)"
    required: false
    default: ""
  branch_pattern:
    description: "Regex for improvement branches (grep -E)"
    required: false
    default: "-improvements$"
  org_name:
    description: "Organization or user name(s): single owner, comma-separated list, or 'all'"
    required: true
  default_owners:
    description: "Comma-separated owners used when org_name is 'all'"
    required: false
    default: "aleon1220,LearningSandboxNZ,secore-ai,spinnaker-hackathon"
  gh_token:
    description: "GitHub token"
    required: true
  report_action:
    description: "Single report operation; takes precedence over legacy boolean inputs"
    required: false
    default: ""
  full_report:
    description: "Legacy: Enable full report (all features)"
    required: false
    default: "true"
  report_only_open_prs:
    description: "Filter report to only open PRs"
    required: false
    default: "false"
  stale_branch_age:
    description: "Include stale branch age tracking"
    required: false
    default: "false"
  pr_status:
    description: "Include PR status & direct links"
    required: false
    default: "false"
  diff_links:
    description: "Include direct diff & comparison deep-links"
    required: false
    default: "false"
  behind_main:
    description: "Include behind-main & conflict risk indicators"
    required: false
    default: "false"
  behind_threshold:
    description: "Commits behind the default branch before a branch is flagged as a conflict risk"
    required: false
    default: "10"
  cleanup_dispatch:
    description: "Include interactive automated cleanup dispatch"
    required: false
    default: "false"
  debug:
    description: "Enable extra diagnostics (verbose gh api call)"
    required: false
    default: "false"

outputs:
  repo_count:
    description: "Total number of repositories processed"
    value: ${{ steps.enumerate.outputs.count }}
  repos_with_improvements:
    description: "Number of repositories with improvement branches"
    value: ${{ steps.process.outputs.improvements_count || '0' }}
  repos_with_prev_improvements:
    description: "Number of repositories with improvement branches from previous months"
    value: ${{ steps.process.outputs.prev_improvements_count || '0' }}
  status:
    description: "Processing status (success/failure/no_repos)"
    value: ${{ steps.process.outputs.status || steps.enumerate.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Validate required inputs
      shell: bash
      run: |
        set -Eeuo pipefail
        if [ -z "${{ inputs.org_name }}" ]; then
          echo "ERROR: org_name input is required" >&2
          exit 1
        fi
        if [ -z "${{ inputs.gh_token }}" ]; then
          echo "ERROR: gh_token input is required" >&2
          exit 1
        fi

    - name: Check GitHub CLI and auth
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      shell: bash
      run: |
        set -Eeuo pipefail
        if ! gh --version >/dev/null 2>&1; then
          echo "ERROR: GitHub CLI 'gh' is not available in PATH" >&2
          exit 1
        fi
        if ! gh auth status -t >/dev/null 2>&1; then
          echo "ERROR: 'gh' authentication not initialized or token invalid" >&2
          echo "Ensure 'gh_token' is a valid token with required scopes." >&2
          exit 1
        fi

        echo "finished step GitHub CLI & auth"

    - name: Bootstrap bash environment (BASH_ENV)
      shell: bash
      run: |
        set -Eeuo pipefail
        ENV_FILE="$RUNNER_TEMP/bash_env"

        cat >"$ENV_FILE" <<'EOF'
        set -Eeuo pipefail
        IFS=$'\n\t'
        # Avoid interactive pagers
        export GIT_PAGER=
        # Reusable logger
        if [ -f "${GITHUB_WORKSPACE}/.github/scripts/logging.sh" ]; then
          # shellcheck source=/dev/null
          source "${GITHUB_WORKSPACE}/.github/scripts/logging.sh"
        else
          log() {
            local level="${1:-INFO}"; shift
            printf "[%s] %s\n" "$level" "$*"
          }
        fi
        # Calendar days (UTC) between an ISO timestamp and today, so "yesterday" always matches the date shown
        days_since() {
          echo $(( ($(date -u -d "$(date -u +%F)" +%s) - $(date -u -d "${1:0:10}" +%s)) / 86400 ))
        }
        # Human-friendly relative time for a number of days: "today", "3 days ago", "2 months ago"
        days_ago() {
          local d="$1"
          if [ "$d" -lt 1 ]; then echo "today"
          elif [ "$d" -eq 1 ]; then echo "yesterday"
          elif [ "$d" -lt 14 ]; then echo "${d} days ago"
          elif [ "$d" -lt 60 ]; then echo "$((d / 7)) weeks ago"
          elif [ "$d" -lt 365 ]; then echo "$((d / 30)) months ago"
          elif [ "$d" -lt 730 ]; then echo "1 year ago"
          else echo "$((d / 365)) years ago"
          fi
        }
        # Per-row sparkline scaled to the row's own peak; "·" = no commits that month
        sparkline() {
          local -a counts bars=(▁ ▂ ▃ ▄ ▅ ▆ ▇ █)
          local c max=0 out=""
          IFS=',' read -r -a counts <<< "$1"
          for c in "${counts[@]}"; do
            if [ "${c:-0}" -gt "$max" ]; then max="$c"; fi
          done
          for c in "${counts[@]}"; do
            if [ "${c:-0}" -eq 0 ]; then out+="·"; else out+="${bars[$(( c * 7 / max ))]}"; fi
          done
          echo "${out:-–}"
        }
        activity_label() {
          case "$1" in
            active) echo "✨ Active" ;;
            quiet) echo "🌙 Quiet" ;;
            dormant) echo "💤 Dormant" ;;
            *) echo "❔ Unknown" ;;
          esac
        }
        # Display "owner/repo" in multi-owner runs and "repo" in single-owner runs
        repo_label() {
          local owner="$1" repo="$2"
          if [ "${MULTI_OWNER:-false}" = "true" ]; then
            echo "${owner}/${repo}"
          else
            echo "${repo}"
          fi
        }
        EOF
        echo "BASH_ENV=$ENV_FILE" >> "$GITHUB_ENV"
        echo "Created a shared bash init file sourced automatically by all subsequent bash steps"

    - name: Resolve reporting options
      id: options
      shell: bash
      run: |
        set -Eeuo pipefail
        REPORT_ACTION="${{ inputs.report_action }}"
        FULL_REPORT="${{ inputs.full_report }}"
        ONLY_OPEN="${{ inputs.report_only_open_prs }}"

        OPT_STALE_AGE=false
        OPT_PR_STATUS=false
        OPT_DIFF_LINKS=false
        OPT_BEHIND_MAIN=false
        OPT_CLEANUP_DISPATCH=false

        if [ -n "$REPORT_ACTION" ]; then
          FULL_REPORT=false
          ONLY_OPEN=false
          case "$REPORT_ACTION" in
            full_report)
              FULL_REPORT=true
              OPT_STALE_AGE=true
              OPT_PR_STATUS=true
              OPT_DIFF_LINKS=true
              OPT_BEHIND_MAIN=true
              OPT_CLEANUP_DISPATCH=true
              ;;
            report_only_open_prs) ONLY_OPEN=true ;;
            stale_branch_age) OPT_STALE_AGE=true ;;
            pr_status) OPT_PR_STATUS=true ;;
            diff_links) OPT_DIFF_LINKS=true ;;
            behind_main) OPT_BEHIND_MAIN=true ;;
            cleanup_dispatch) OPT_CLEANUP_DISPATCH=true ;;
            *)
              log WARN "Unknown report_action '${REPORT_ACTION}', falling back to legacy inputs"
              REPORT_ACTION=""
              ;;
          esac
        fi

        if [ -z "$REPORT_ACTION" ]; then
          if [ "$FULL_REPORT" = "true" ]; then
            OPT_STALE_AGE=true
            OPT_PR_STATUS=true
            OPT_DIFF_LINKS=true
            OPT_BEHIND_MAIN=true
            OPT_CLEANUP_DISPATCH=true
          else
            OPT_STALE_AGE="${{ inputs.stale_branch_age }}"
            OPT_PR_STATUS="${{ inputs.pr_status }}"
            OPT_DIFF_LINKS="${{ inputs.diff_links }}"
            OPT_BEHIND_MAIN="${{ inputs.behind_main }}"
            OPT_CLEANUP_DISPATCH="${{ inputs.cleanup_dispatch }}"
          fi
        fi

        BEHIND_THRESHOLD="${{ inputs.behind_threshold }}"
        if ! [[ "$BEHIND_THRESHOLD" =~ ^[0-9]+$ ]] || [ "$BEHIND_THRESHOLD" -lt 1 ]; then
          log WARN "Invalid behind_threshold '${BEHIND_THRESHOLD}', falling back to 10"
          BEHIND_THRESHOLD=10
        fi

        RAW_ORG_NAME="${{ inputs.org_name }}"
        DEFAULT_OWNERS="${{ inputs.default_owners }}"
        if [ "$RAW_ORG_NAME" = "all" ]; then
          RESOLVED_OWNERS_RAW="$DEFAULT_OWNERS"
        else
          RESOLVED_OWNERS_RAW="$RAW_ORG_NAME"
        fi

        OWNERS_LIST=()
        IFS=$', \t\n' read -r -a RAW_ARR <<< "$RESOLVED_OWNERS_RAW"
        for item in "${RAW_ARR[@]}"; do
          [ -z "$item" ] && continue
          already=false
          for existing in "${OWNERS_LIST[@]:-}"; do
            if [ "$existing" = "$item" ]; then already=true; break; fi
          done
          [ "$already" = false ] && OWNERS_LIST+=("$item")
        done
        printf "%s\n" "${OWNERS_LIST[@]}" > "$RUNNER_TEMP/owners.txt"
        OWNER_COUNT=${#OWNERS_LIST[@]}
        MULTI_OWNER=false
        [ "$OWNER_COUNT" -gt 1 ] && MULTI_OWNER=true
        OWNERS_CSV=$(IFS=','; echo "${OWNERS_LIST[*]}")
        OWNERS_DISPLAY=$(IFS=', '; echo "${OWNERS_LIST[*]}")
        if [ "$OWNER_COUNT" -eq 1 ]; then
          ARTIFACT_SLUG="${OWNERS_LIST[0]}"
        elif [ "$RAW_ORG_NAME" = "all" ]; then
          ARTIFACT_SLUG="all"
        else
          ARTIFACT_SLUG="multi-owner"
        fi

        log INFO "Resolved reporting options:"
        log INFO "  owners=$OWNERS_DISPLAY (count=$OWNER_COUNT, multi_owner=$MULTI_OWNER)"
        log INFO "  full_report=$FULL_REPORT"
        log INFO "  report_only_open_prs=$ONLY_OPEN"
        log INFO "  stale_branch_age=$OPT_STALE_AGE"
        log INFO "  pr_status=$OPT_PR_STATUS"
        log INFO "  diff_links=$OPT_DIFF_LINKS"
        log INFO "  behind_main=$OPT_BEHIND_MAIN"
        log INFO "  behind_threshold=$BEHIND_THRESHOLD"
        log INFO "  cleanup_dispatch=$OPT_CLEANUP_DISPATCH"

        echo "FULL_REPORT=$FULL_REPORT" >> "$GITHUB_ENV"
        echo "OPT_ONLY_OPEN_PRS=$ONLY_OPEN" >> "$GITHUB_ENV"
        echo "OPT_STALE_AGE=$OPT_STALE_AGE" >> "$GITHUB_ENV"
        echo "OPT_PR_STATUS=$OPT_PR_STATUS" >> "$GITHUB_ENV"
        echo "OPT_DIFF_LINKS=$OPT_DIFF_LINKS" >> "$GITHUB_ENV"
        echo "OPT_BEHIND_MAIN=$OPT_BEHIND_MAIN" >> "$GITHUB_ENV"
        echo "OPT_BEHIND_THRESHOLD=$BEHIND_THRESHOLD" >> "$GITHUB_ENV"
        echo "OPT_CLEANUP_DISPATCH=$OPT_CLEANUP_DISPATCH" >> "$GITHUB_ENV"
        echo "MULTI_OWNER=$MULTI_OWNER" >> "$GITHUB_ENV"
        echo "OWNER_COUNT=$OWNER_COUNT" >> "$GITHUB_ENV"
        echo "OWNERS_CSV=$OWNERS_CSV" >> "$GITHUB_ENV"
        echo "OWNERS_DISPLAY=$OWNERS_DISPLAY" >> "$GITHUB_ENV"
        echo "artifact_slug=$ARTIFACT_SLUG" >> "$GITHUB_OUTPUT"

    - name: List repositories
      id: list
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      shell: bash
      run: |
        # log is available via BASH_ENV
        : > "$RUNNER_TEMP/repos_all.txt"
        : > "$RUNNER_TEMP/owner_repo_counts.txt"
        while IFS= read -r OWNER; do
          [ -z "$OWNER" ] && continue
          log INFO "Listing non-archived repositories for ${OWNER}"
          OWNER_TYPE=$(gh api "users/${OWNER}" --jq '.type' 2>/dev/null || echo "Unknown")
          REPOS=$(gh repo list "$OWNER" --limit 1000 --no-archived --json name --jq '.[].name' 2>/dev/null || echo "")
          O_COUNT=0
          while IFS= read -r R; do
            [ -z "$R" ] && continue
            echo "${OWNER}/${R}" >> "$RUNNER_TEMP/repos_all.txt"
            O_COUNT=$((O_COUNT + 1))
          done <<< "$REPOS"
          echo "${OWNER}|${OWNER_TYPE}|${O_COUNT}" >> "$RUNNER_TEMP/owner_repo_counts.txt"
          log INFO "Repositories returned for ${OWNER} (${OWNER_TYPE}): ${O_COUNT}"
        done < "$RUNNER_TEMP/owners.txt"
        ALL_COUNT=$(sed '/^\s*$/d' "$RUNNER_TEMP/repos_all.txt" | wc -l | tr -d ' ')
        log INFO "Total repositories returned: ${ALL_COUNT}"
        echo "all_count=${ALL_COUNT}" >> "$GITHUB_OUTPUT"

    - name: Enumerate selection (apply filter and set outputs)
      id: enumerate
      env:
        ORG_NAME: ${{ inputs.org_name }}
        REPO_FILTER: ${{ inputs.repo_filter }}
      shell: bash
      run: |
        set -Eeuo pipefail
        : > "$RUNNER_TEMP/repos.txt"
        if [ -s "$RUNNER_TEMP/repos_all.txt" ]; then
          if [ -n "${REPO_FILTER:-}" ]; then
            log INFO "Applying repo filter: ${REPO_FILTER}"
            # Write grep results to repos.txt regardless of match results; avoid option parsing with leading '-'
            if ! grep -i -- "${REPO_FILTER}" "$RUNNER_TEMP/repos_all.txt" > "$RUNNER_TEMP/repos.txt"; then
              true # allow no matches without failing the step
            fi
          else
            cp "$RUNNER_TEMP/repos_all.txt" "$RUNNER_TEMP/repos.txt"
          fi
        fi
        COUNT=$(sed '/^\s*$/d' "$RUNNER_TEMP/repos.txt" | wc -l | tr -d ' ')
        log INFO "Selected repository count: ${COUNT}"
        echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

        if [ "$COUNT" -eq 0 ]; then
          log WARN "No repositories matched the selection."
          echo "status=no_repos" >> "$GITHUB_OUTPUT"
        else
          echo "status=has_repos" >> "$GITHUB_OUTPUT"
        fi
        log INFO "finished step Enumerate selection"

    - name: Initialize metrics when no repos
      id: init_metrics
      if: steps.enumerate.outputs.status == 'no_repos'
      shell: bash
      run: |
        echo "improvements_count=0" >> "$GITHUB_OUTPUT"
        echo "prev_improvements_count=0" >> "$GITHUB_OUTPUT"
        echo "status=no_repos" >> "$GITHUB_OUTPUT"
        log INFO "Initialized metrics for empty selection (no_repos)"

    - name: Process repos - Phase 1 - Collect repository metadata
      id: phase1_metadata
      if: steps.enumerate.outputs.status == 'has_repos'
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      shell: bash
      run: |
        set -Eeuo pipefail
        REPOS_PROCESSED=0

        log INFO "Phase 1: Starting repository metadata collection"
        METADATA_FILE="$RUNNER_TEMP/repos_metadata.txt"
        : > "$METADATA_FILE"

        while IFS='/' read -r OWNER REPO; do
          [ -z "$OWNER" ] || [ -z "$REPO" ] && continue
          # FIX: Replaced post-increment to prevent exit code 1 when value is 0
          REPOS_PROCESSED=$((REPOS_PROCESSED + 1))
          log INFO "Phase 1: Processing repository #${REPOS_PROCESSED}: ${OWNER}/${REPO}"

          log DEBUG "Phase 1: Fetching metadata for ${OWNER}/${REPO}"
          DEFAULT_BRANCH=$(gh api "repos/${OWNER}/${REPO}" --jq '.default_branch' 2>/dev/null || echo "")
          
          if [ -z "$DEFAULT_BRANCH" ]; then
            log ERROR "Phase 1: Failed to fetch default branch for ${OWNER}/${REPO}. Skipping."
            continue
          fi

          VISIBILITY=$(gh api "repos/${OWNER}/${REPO}" --jq '.visibility' 2>/dev/null || echo "")
          log INFO "Phase 1: Repository ${OWNER}/${REPO} - branch=${DEFAULT_BRANCH} visibility=${VISIBILITY}"

          if [ "$DEFAULT_BRANCH" != "main" ]; then
            log WARN "Phase 1: Repository ${OWNER}/${REPO} uses non-standard default branch: ${DEFAULT_BRANCH}"
          fi

          echo "${OWNER}|${REPO}|${DEFAULT_BRANCH}|${VISIBILITY}" >> "$METADATA_FILE"
        done < "$RUNNER_TEMP/repos.txt"

        log INFO "Phase 1 completed: ${REPOS_PROCESSED} repositories processed"
        echo "repos_processed=${REPOS_PROCESSED}" >> "$GITHUB_OUTPUT"

    - name: Process repos - Phase 2 - Fetch branches and filter improvements
      id: phase2_branches
      if: steps.enumerate.outputs.status == 'has_repos'
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        BRANCH_PATTERN: ${{ inputs.branch_pattern }}
      shell: bash
      run: |
        set -Eeuo pipefail
        REPOS_CHECKED=0
        REPOS_WITH_IMPROVEMENTS=0

        log INFO "Phase 2: Starting branch filtering"
        BRANCHES_FILE="$RUNNER_TEMP/improvement_branches.txt"
        : > "$BRANCHES_FILE"
        PREV_MONTH_REPOS_FILE="$RUNNER_TEMP/prev_month_improvement_repos.txt"
        : > "$PREV_MONTH_REPOS_FILE"
        CURRENT_YM=$(date +%Y-%m)

        while IFS='|' read -r OWNER REPO DEFAULT_BRANCH VISIBILITY; do
          [ -z "$REPO" ] && continue
          REPOS_CHECKED=$((REPOS_CHECKED + 1))
          log DEBUG "Phase 2: Fetching branches for ${OWNER}/${REPO}"

          ALL_BRANCHES=$(gh api "repos/${OWNER}/${REPO}/branches?per_page=100" --paginate --jq '.[].name' 2>/dev/null || echo "")
          BRANCH_COUNT=$(printf "%s\n" "$ALL_BRANCHES" | sed '/^\s*$/d' | wc -l | tr -d ' ')
          log INFO "Phase 2: Repository ${OWNER}/${REPO} has ${BRANCH_COUNT} total branches"

          if [ -n "${BRANCH_PATTERN:-}" ]; then
            IMPROVEMENT_BRANCHES=$(printf "%s\n" "$ALL_BRANCHES" | grep -E -- "${BRANCH_PATTERN}" || true)
          else
            IMPROVEMENT_BRANCHES=""
          fi

          if [ -z "$IMPROVEMENT_BRANCHES" ]; then
            log DEBUG "Phase 2: No improvement branches found in ${OWNER}/${REPO} for pattern: ${BRANCH_PATTERN}"
          else
            REPO_HAS_IMPROVEMENTS=false
            while read -r BR; do
              [ -z "$BR" ] && continue

              # If report_only_open_prs is active, skip branches without an open PR
              if [ "${OPT_ONLY_OPEN_PRS:-false}" = "true" ]; then
                OPEN_PR_NUM=$(gh pr list -R "${OWNER}/${REPO}" -H "${BR}" --state open --limit 1 --json number --jq '.[0].number' 2>/dev/null || echo "")
                if [ -z "$OPEN_PR_NUM" ]; then
                  log DEBUG "Phase 2: Skipping ${BR} in ${OWNER}/${REPO} (report_only_open_prs is active and no open PR exists)"
                  continue
                fi
              fi

              if [ "$REPO_HAS_IMPROVEMENTS" = false ]; then
                REPOS_WITH_IMPROVEMENTS=$((REPOS_WITH_IMPROVEMENTS + 1))
                REPO_HAS_IMPROVEMENTS=true
                log INFO "Phase 2: Repository ${OWNER}/${REPO} has qualifying improvement branches"
              fi

              # Check if branch is from a previous month
              IS_PREV_MONTH=false
              if [[ "$BR" =~ ^([0-9]{4}-[0-9]{2})- ]]; then
                BRANCH_YM="${BASH_REMATCH[1]}"
                if [[ "$BRANCH_YM" < "$CURRENT_YM" ]]; then
                  IS_PREV_MONTH=true
                fi
              else
                COMMIT_DATE=$(gh api "repos/${OWNER}/${REPO}/branches/${BR}" --jq '.commit.commit.committer.date' 2>/dev/null || echo "")
                if [ -n "$COMMIT_DATE" ] && [[ "${COMMIT_DATE:0:7}" < "$CURRENT_YM" ]]; then
                  IS_PREV_MONTH=true
                fi
              fi

              if [ "$IS_PREV_MONTH" = true ]; then
                log INFO "Phase 2: Improvement branch ${BR} in ${OWNER}/${REPO} is from a previous month"
                echo "${OWNER}|${REPO}" >> "$PREV_MONTH_REPOS_FILE"
              fi

              echo "${OWNER}|${REPO}|${DEFAULT_BRANCH}|${VISIBILITY}|${BR}|${IS_PREV_MONTH}" >> "$BRANCHES_FILE"
            done < <(printf "%s\n" "$IMPROVEMENT_BRANCHES" | sort -r)
          fi
        done < "$RUNNER_TEMP/repos_metadata.txt"

        if [ -s "$PREV_MONTH_REPOS_FILE" ]; then
          sort --unique --output="$PREV_MONTH_REPOS_FILE" "$PREV_MONTH_REPOS_FILE"
          PREV_IMP_COUNT=$(sed '/^\s*$/d' "$PREV_MONTH_REPOS_FILE" | wc -l | tr -d ' ')
        else
          PREV_IMP_COUNT=0
        fi

        echo "repos_with_improvements=${REPOS_WITH_IMPROVEMENTS}" >> "$GITHUB_OUTPUT"
        echo "repos_with_prev_improvements=${PREV_IMP_COUNT}" >> "$GITHUB_OUTPUT"
        log INFO "Phase 2 completed: ${REPOS_CHECKED} repos checked, ${REPOS_WITH_IMPROVEMENTS} with improvements, ${PREV_IMP_COUNT} with previous months improvements"

    - name: Process repos - Phase 3 - Analyze branch comparisons
      id: phase3_comparisons
      if: steps.phase2_branches.outputs.repos_with_improvements != '0'
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      shell: bash
      run: |
        set -Eeuo pipefail
        BRANCHES_ANALYZED=0

        log INFO "Phase 3: Starting branch comparison analysis"
        COMPARISON_FILE="$RUNNER_TEMP/branch_comparisons.txt"
        : > "$COMPARISON_FILE"
        DETAILS_FILE="$RUNNER_TEMP/branch_details.txt"
        : > "$DETAILS_FILE"
        CLEANUP_FILE="$RUNNER_TEMP/cleanup_candidates.txt"
        : > "$CLEANUP_FILE"
        SYNC_FILE="$RUNNER_TEMP/sync_candidates.txt"
        : > "$SYNC_FILE"
        # Raw (unformatted) branch data for the JSON/CSV export
        BRANCHES_RAW_FILE="$RUNNER_TEMP/branches_raw.txt"
        : > "$BRANCHES_RAW_FILE"

        while IFS='|' read -r OWNER REPO DEFAULT_BRANCH VISIBILITY BR IS_PREV_MONTH; do
          [ -z "$REPO" ] && continue
          BRANCHES_ANALYZED=$((BRANCHES_ANALYZED + 1))
          BR_LAST_COMMIT=""
          PR_NUM=""
          RISK_LEVEL=""

          log DEBUG "Phase 3: Analyzing branch ${BR} in ${OWNER}/${REPO}"
          AHEAD_BY=$(gh api "repos/${OWNER}/${REPO}/compare/${DEFAULT_BRANCH}...${BR}" --jq '.ahead_by' 2>/dev/null || echo "0")
          BEHIND_BY=$(gh api "repos/${OWNER}/${REPO}/compare/${DEFAULT_BRANCH}...${BR}" --jq '.behind_by' 2>/dev/null || echo "0")
          
          log INFO "Phase 3: Branch comparison - owner=${OWNER} repo=${REPO} base=${DEFAULT_BRANCH} branch=${BR} ahead=${AHEAD_BY} behind=${BEHIND_BY}"
          echo "${OWNER}|${REPO}|${DEFAULT_BRANCH}|${VISIBILITY}|${BR}|${AHEAD_BY}|${BEHIND_BY}" >> "$COMPARISON_FILE"

          # 1. Stale Branch Age Tracking
          AGE_TEXT=""
          if [ "${OPT_STALE_AGE:-false}" = "true" ]; then
            COMMIT_DATE=$(gh api "repos/${OWNER}/${REPO}/branches/${BR}" --jq '.commit.commit.committer.date' 2>/dev/null || echo "")
            BR_LAST_COMMIT="$COMMIT_DATE"
            if [ -n "$COMMIT_DATE" ]; then
              COMMIT_TS=$(date -d "$COMMIT_DATE" +%s 2>/dev/null || echo "")
              if [ -n "$COMMIT_TS" ]; then
                DAYS_OLD=$(days_since "$COMMIT_DATE")
                AGO=$(days_ago "$DAYS_OLD")

                # Staleness status (one monthly cycle = abandoned)
                if [ "$DAYS_OLD" -lt 14 ]; then
                  STATUS="🟢 Active"
                elif [ "$DAYS_OLD" -le 30 ]; then
                  STATUS="🟡 Stale"
                else
                  STATUS="🔴 Abandoned"
                fi

                AGE_TEXT="${STATUS}, last commit ${AGO} (${COMMIT_DATE:0:10})"
              fi
            fi
            [ -z "$AGE_TEXT" ] && AGE_TEXT="⚪ Last commit date unknown"
          fi

          # 2. PR Status & Direct Links
          PR_TEXT=""
          PR_STATE=""
          if [ "${OPT_PR_STATUS:-false}" = "true" ] || [ "${OPT_CLEANUP_DISPATCH:-false}" = "true" ]; then
            # Prefer an open PR; otherwise fall back to the most recent PR of any state
            PR_JSON=$(gh pr list -R "${OWNER}/${REPO}" -H "${BR}" --state all --limit 5 --json number,state,url,isDraft,reviewDecision --jq '(map(select(.state == "OPEN")) + .)[0]' 2>/dev/null || echo "")
            if [ -n "$PR_JSON" ] && [ "$PR_JSON" != "null" ]; then
              PR_NUM=$(echo "$PR_JSON" | jq -r '.number // ""')
              PR_STATE=$(echo "$PR_JSON" | jq -r '.state // ""')
              PR_URL=$(echo "$PR_JSON" | jq -r '.url // ""')
              PR_DRAFT=$(echo "$PR_JSON" | jq -r '.isDraft')
              PR_REVIEW=$(echo "$PR_JSON" | jq -r '.reviewDecision // ""')
              PR_LINK="[#${PR_NUM}](${PR_URL})"

              case "$PR_STATE" in
                OPEN)
                  if [ "$PR_DRAFT" = "true" ]; then
                    PR_TEXT="📝 Draft PR ${PR_LINK}"
                  else
                    PR_TEXT="🔀 Open PR ${PR_LINK}"
                    case "$PR_REVIEW" in
                      APPROVED) PR_TEXT+=", ✅ approved" ;;
                      CHANGES_REQUESTED) PR_TEXT+=", ❌ changes requested" ;;
                      REVIEW_REQUIRED) PR_TEXT+=", 👀 awaiting review" ;;
                    esac
                  fi
                  ;;
                MERGED) PR_TEXT="🟣 Merged PR ${PR_LINK}" ;;
                CLOSED) PR_TEXT="🚫 Closed PR ${PR_LINK} (not merged)" ;;
                *) PR_TEXT="PR ${PR_LINK} (${PR_STATE})" ;;
              esac
            else
              PR_TEXT="➕ No PR yet: [create one](https://github.com/${OWNER}/${REPO}/compare/${DEFAULT_BRANCH}...${BR}?expand=1)"
            fi
          fi

          # 3. Direct Diff & Comparison Deep-Links
          DIFF_TEXT=""
          if [ "${OPT_DIFF_LINKS:-false}" = "true" ]; then
            DIFF_TEXT="[Compare](https://github.com/${OWNER}/${REPO}/compare/${DEFAULT_BRANCH}...${BR})"
          fi

          # 4. Behind-Main & Conflict Risk Indicators
          # A branch with no commits ahead has nothing to conflict, so only branches
          # with their own commits are rated. Above the threshold = high risk, above
          # 5x the threshold = very high risk.
          BEHIND_TEXT=""
          if [ "${OPT_BEHIND_MAIN:-false}" = "true" ]; then
            THRESHOLD="${OPT_BEHIND_THRESHOLD:-10}"
            AHEAD="${AHEAD_BY:-0}"
            BEHIND="${BEHIND_BY:-0}"
            CONFLICT_RISK=false

            BEHIND_WORDS="${BEHIND} commits behind ${DEFAULT_BRANCH}"
            [ "$BEHIND" -eq 1 ] && BEHIND_WORDS="1 commit behind ${DEFAULT_BRANCH}"
            AHEAD_WORDS="${AHEAD} commits ahead"
            [ "$AHEAD" -eq 1 ] && AHEAD_WORDS="1 commit ahead"

            if [ "$BEHIND" -eq 0 ] && [ "$AHEAD" -eq 0 ]; then
              BEHIND_TEXT="Up to date with ${DEFAULT_BRANCH}, no new commits"
              RISK_LEVEL="none"
            elif [ "$BEHIND" -eq 0 ]; then
              BEHIND_TEXT="Up to date with ${DEFAULT_BRANCH}, ${AHEAD_WORDS}"
              RISK_LEVEL="none"
            elif [ "$AHEAD" -eq 0 ]; then
              BEHIND_TEXT="No new commits, ${BEHIND_WORDS}"
              RISK_LEVEL="none"
            elif [ "$BEHIND" -le "$THRESHOLD" ]; then
              BEHIND_TEXT="Low conflict risk: ${BEHIND_WORDS}, ${AHEAD} ahead"
              RISK_LEVEL="low"
            elif [ "$BEHIND" -le $((THRESHOLD * 5)) ]; then
              BEHIND_TEXT="⚠️ High conflict risk: ${BEHIND_WORDS}, ${AHEAD} ahead"
              RISK_LEVEL="high"
              CONFLICT_RISK=true
            else
              BEHIND_TEXT="🚨 Very high conflict risk: ${BEHIND_WORDS}, ${AHEAD} ahead"
              RISK_LEVEL="very_high"
              CONFLICT_RISK=true
            fi

            # Flagged branches get a "sync with the default branch" command in the summary.
            # Merged branches are skipped (when PR status is known) since they are done.
            if [ "$CONFLICT_RISK" = true ] && [ "$PR_STATE" != "MERGED" ]; then
              echo "${OWNER}|${REPO}|${BR}|${DEFAULT_BRANCH}|${BEHIND}|${AHEAD}" >> "$SYNC_FILE"
            fi
          fi

          # 5. Interactive Automated Cleanup Dispatch Candidate
          # Current-month improvement branches must NEVER be suggested for deletion.
          # Only branches from previous months that are merged or have 0 commits ahead are eligible.
          CURRENT_YM=$(date +%Y-%m)
          CURRENT_MONTH_LOWER=$(LC_ALL=C date +%B | tr '[:upper:]' '[:lower:]')
          IS_CURRENT_MONTH=false
          if [[ "$BR" =~ ^([0-9]{4}-[0-9]{2})- ]]; then
            [ "${BASH_REMATCH[1]}" = "$CURRENT_YM" ] && IS_CURRENT_MONTH=true
          fi
          if [[ "$BR" =~ ${CURRENT_MONTH_LOWER} ]]; then
            IS_CURRENT_MONTH=true
          fi

          if [ "${OPT_CLEANUP_DISPATCH:-false}" = "true" ] && [ "$IS_CURRENT_MONTH" = false ] && [ "${IS_PREV_MONTH:-false}" = "true" ]; then
            if [ "${AHEAD_BY:-0}" -eq 0 ] || [ "$PR_STATE" = "MERGED" ]; then
              echo "${OWNER}|${REPO}|${BR}|${AHEAD_BY}|${PR_STATE}" >> "$CLEANUP_FILE"
            fi
          fi

          echo "${OWNER}|${REPO}|${BR}|${AGE_TEXT}|${PR_TEXT}|${DIFF_TEXT}|${BEHIND_TEXT}" >> "$DETAILS_FILE"
          echo "${OWNER}|${REPO}|${DEFAULT_BRANCH}|${BR}|${IS_PREV_MONTH}|${AHEAD_BY}|${BEHIND_BY}|${BR_LAST_COMMIT}|${PR_NUM}|${PR_STATE}|${RISK_LEVEL}" >> "$BRANCHES_RAW_FILE"
        done < "$RUNNER_TEMP/improvement_branches.txt"

        echo "branches_analyzed=${BRANCHES_ANALYZED}" >> "$GITHUB_OUTPUT"
        log INFO "Phase 3 completed: total ${BRANCHES_ANALYZED} github branches analyzed"

    - name: Process repos - Phase 4 - Collect merge history and main branch activity
      id: phase4_merges
      if: steps.enumerate.outputs.status == 'has_repos'
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      shell: bash
      run: |
        set -Eeuo pipefail
        REPOS_MERGED_CHECKED=0
        TREND_MONTHS=6
        TREND_WEEKS=6

        log INFO "Phase 4: Starting merge history and main branch activity collection"
        MERGE_FILE="$RUNNER_TEMP/merge_history.txt"
        : > "$MERGE_FILE"
        MAIN_FILE="$RUNNER_TEMP/main_activity.txt"
        : > "$MAIN_FILE"

        # Calendar months for the trend, oldest first. The last one is the current month to date.
        MONTH_START=$(date -u +%Y-%m-01)
        MONTHS=()
        for ((i = TREND_MONTHS - 1; i >= 0; i--)); do
          MONTHS+=("$(date -u -d "${MONTH_START} -${i} month" +%Y-%m)")
        done
        printf "%s\n" "${MONTHS[@]}" > "$RUNNER_TEMP/trend_months.txt"

        TODAY=$(date -u +%Y-%m-%d)
        DAYS_FROM_MONDAY=$(($(date -u -d "$TODAY" +%u) - 1))
        CURRENT_MONDAY=$(date -u -d "$TODAY -${DAYS_FROM_MONDAY} days" +%Y-%m-%d)
        WEEKS=()
        for ((i = TREND_WEEKS - 1; i >= 0; i--)); do
          WEEKS+=("$(date -u -d "$CURRENT_MONDAY -${i} weeks" +%Y-%m-%d)")
        done
        printf "%s\n" "${WEEKS[@]}" > "$RUNNER_TEMP/trend_weeks.txt"

        # One GraphQL query per repo: last commit on the default branch, monthly and weekly history, open PRs
        HISTORY_FIELDS=""
        for i in "${!MONTHS[@]}"; do
          SINCE="${MONTHS[$i]}-01T00:00:00Z"
          UNTIL=$(date -u -d "${MONTHS[$i]}-01 +1 month" +%Y-%m-01T00:00:00Z)
          HISTORY_FIELDS+=" m${i}: history(since: \"${SINCE}\", until: \"${UNTIL}\") { totalCount }"
        done
        for i in "${!WEEKS[@]}"; do
          SINCE="${WEEKS[$i]}T00:00:00Z"
          UNTIL=$(date -u -d "${WEEKS[$i]} +7 days" +%Y-%m-%dT%H:%M:%SZ)
          HISTORY_FIELDS+=" w${i}: history(since: \"${SINCE}\", until: \"${UNTIL}\") { totalCount }"
        done
        MAIN_QUERY="query(\$owner: String!, \$name: String!, \$base: String!) {
          repository(owner: \$owner, name: \$name) {
            defaultBranchRef { target { ... on Commit { committedDate ${HISTORY_FIELDS} } } }
            pullRequests(states: OPEN, baseRefName: \$base) { totalCount }
          }
        }"
        # -> "lastCommit|openPRs|c0,c1,...,c5"
        MAIN_JQ='.data.repository as $r | ($r.defaultBranchRef.target // {}) as $t
          | [($t.committedDate // ""),
             ($r.pullRequests.totalCount // 0 | tostring),
             ([range(0; '"${TREND_MONTHS}"')] | map($t["m\(.)"].totalCount // 0 | tostring) | join(",")),
             ([range(0; '"${TREND_WEEKS}"')] | map($t["w\(.)"].totalCount // 0 | tostring) | join(","))]
          | join("|")'

        while IFS='|' read -r OWNER REPO DEFAULT_BRANCH VISIBILITY; do
          [ -z "$REPO" ] && continue
          REPOS_MERGED_CHECKED=$((REPOS_MERGED_CHECKED + 1))

          log DEBUG "Phase 4: Fetching merge history for ${OWNER}/${REPO}"
          LAST_MERGED=$(gh pr list -R "${OWNER}/${REPO}" --state merged --base "$DEFAULT_BRANCH" --limit 1 --json mergedAt --jq '.[0].mergedAt' 2>/dev/null || echo "")
          
          if [ -z "$LAST_MERGED" ]; then
            log INFO "Phase 4: No merged PRs found for ${OWNER}/${REPO} into ${DEFAULT_BRANCH}"
            LAST_MERGED="none"
          else
            log INFO "Phase 4: Last merged PR for ${OWNER}/${REPO}: ${LAST_MERGED}"
          fi

          echo "${OWNER}|${REPO}|${LAST_MERGED}" >> "$MERGE_FILE"

          # Main branch activity
          MAIN_ROW=$(gh api graphql -f query="$MAIN_QUERY" -f owner="$OWNER" -f name="$REPO" -f base="$DEFAULT_BRANCH" --jq "$MAIN_JQ" 2>/dev/null || echo "")
          IFS='|' read -r LAST_COMMIT OPEN_PRS COUNTS WEEK_COUNTS <<< "${MAIN_ROW:-|||}"
          if [ -z "$MAIN_ROW" ]; then
            log WARN "Phase 4: Could not read ${DEFAULT_BRANCH} activity for ${OWNER}/${REPO}"
          fi

          TOTAL=0
          IFS=',' read -r -a COUNT_LIST <<< "$COUNTS"
          for C in "${COUNT_LIST[@]}"; do TOTAL=$((TOTAL + ${C:-0})); done

          DAYS_SINCE=""
          ACTIVITY="unknown"
          if [ -n "$LAST_COMMIT" ]; then
            DAYS_SINCE=$(days_since "$LAST_COMMIT")
            if [ "$DAYS_SINCE" -le 30 ]; then
              ACTIVITY="active"
            elif [ "$DAYS_SINCE" -le 90 ]; then
              ACTIVITY="quiet"
            else
              ACTIVITY="dormant"
            fi
          fi

          log INFO "Phase 4: ${OWNER}/${REPO} ${DEFAULT_BRANCH} activity=${ACTIVITY} last_commit=${LAST_COMMIT:-none} commits_by_month=${COUNTS:-n/a} commits_by_week=${WEEK_COUNTS:-n/a} open_prs=${OPEN_PRS:-n/a}"
          echo "${OWNER}|${REPO}|${DEFAULT_BRANCH}|${VISIBILITY}|${LAST_COMMIT}|${DAYS_SINCE}|${ACTIVITY}|${OPEN_PRS:-0}|${TOTAL}|${COUNTS}|${LAST_MERGED}|${WEEK_COUNTS:-}" >> "$MAIN_FILE"
        done < "$RUNNER_TEMP/repos_metadata.txt"

        echo "repos_checked=${REPOS_MERGED_CHECKED}" >> "$GITHUB_OUTPUT"
        log INFO "Phase 4 completed: ${REPOS_MERGED_CHECKED} repositories checked for merge history and main branch activity"

    - name: Process repos - Phase 5 - Aggregate results generate reports
      id: process
      if: steps.enumerate.outputs.status == 'has_repos'
      shell: bash
      run: |
        set -Eeuo pipefail

        log INFO "Phase 5: Starting results aggregation"

        REPOS_PROCESSED=${{ steps.phase1_metadata.outputs.repos_processed || '0' }}
        REPOS_WITH_IMPROVEMENTS=${{ steps.phase2_branches.outputs.repos_with_improvements || '0' }}
        REPOS_WITH_PREV=${{ steps.phase2_branches.outputs.repos_with_prev_improvements || '0' }}
        BRANCHES_ANALYZED=${{ steps.phase3_comparisons.outputs.branches_analyzed || '0' }}

        log INFO "Phase 5: Preparing comprehensive summary"
        log INFO "Phase 5: Total repositories processed: ${REPOS_PROCESSED}"
        log INFO "Phase 5: Repositories with improvements: ${REPOS_WITH_IMPROVEMENTS}"
        log INFO "Phase 5: Repositories with previous month improvements: ${REPOS_WITH_PREV}"
        log INFO "Phase 5: Branches analyzed: ${BRANCHES_ANALYZED}"

        if [ -f "$RUNNER_TEMP/branch_comparisons.txt" ]; then
          log DEBUG "Phase 5: Generating comparison details report"
          while IFS='|' read -r OWNER REPO DEFAULT_BRANCH VISIBILITY BR AHEAD BEHIND; do
            [ -z "$REPO" ] && continue
            echo "::group::Report for ${OWNER}/${REPO}/${BR}"
            log INFO "Comparison: owner=${OWNER} repo=${REPO} base=${DEFAULT_BRANCH} branch=${BR} ahead=${AHEAD} behind=${BEHIND}"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/branch_comparisons.txt"
        fi

        log INFO "Phase 5: Compiling final outputs"
        echo "improvements_count=${REPOS_WITH_IMPROVEMENTS}" >> "$GITHUB_OUTPUT"
        echo "prev_improvements_count=${REPOS_WITH_PREV}" >> "$GITHUB_OUTPUT"
        echo "status=success" >> "$GITHUB_OUTPUT"
        log INFO "Phase 5 completed: Results aggregation finished"
        log INFO "Processing workflow completed successfully"

    - name: Render multi-owner overview
      if: steps.enumerate.outputs.status == 'has_repos' && env.MULTI_OWNER == 'true'
      shell: bash
      run: |
        set -Eeuo pipefail
        MAIN_FILE="$RUNNER_TEMP/main_activity.txt"
        BRANCHES_FILE="$RUNNER_TEMP/improvement_branches.txt"
        OWNER_COUNTS_FILE="$RUNNER_TEMP/owner_repo_counts.txt"
        SECTION_FILE="$RUNNER_TEMP/multi_owner_section.md"
        : > "$SECTION_FILE"
        [ -s "$MAIN_FILE" ] || exit 0
        mapfile -t MONTHS < "$RUNNER_TEMP/trend_months.txt"
        mapfile -t WEEKS < "$RUNNER_TEMP/trend_weeks.txt"
        N_MONTHS=${#MONTHS[@]}
        N_WEEKS=${#WEEKS[@]}

        USER_COUNT=0
        ORG_COUNT=0
        TOT_REPOS=0
        TOT_ACTIVE=0
        TOT_QUIET=0
        TOT_DORMANT=0
        TOT_COMMITS_6M=0
        TOT_COMMITS_6W=0
        TOT_OPEN_PRS=0
        TOT_IMP_BRANCHES=0
        TOT_IMP_REPOS=0
        ALL_MONTH_TOTALS=()
        for ((i = 0; i < N_MONTHS; i++)); do ALL_MONTH_TOTALS+=(0); done

        OWNER_LABELS=()
        OWNER_COMMITS=()
        OWNER_PEAK=1
        TABLE_ROWS=()

        while IFS='|' read -r OWNER OWNER_TYPE _; do
          [ -z "$OWNER" ] && continue
          TYPE_BADGE="❔ ${OWNER_TYPE}"
          case "$OWNER_TYPE" in
            User) TYPE_BADGE="👤 User"; USER_COUNT=$((USER_COUNT + 1)) ;;
            Organization) TYPE_BADGE="🏢 Org"; ORG_COUNT=$((ORG_COUNT + 1)) ;;
          esac

          O_REPOS=0
          O_ACTIVE=0
          O_QUIET=0
          O_DORMANT=0
          O_COMMITS_6M=0
          O_COMMITS_6W=0
          O_OPEN_PRS=0
          O_MONTHS=()
          for ((i = 0; i < N_MONTHS; i++)); do O_MONTHS+=(0); done

          while IFS='|' read -r M_OWNER M_REPO _ _ _ _ M_ACT M_PRS M_TOTAL M_COUNTS _ M_WEEKS; do
            [ "$M_OWNER" = "$OWNER" ] || continue
            O_REPOS=$((O_REPOS + 1))
            case "$M_ACT" in
              active) O_ACTIVE=$((O_ACTIVE + 1)) ;;
              quiet) O_QUIET=$((O_QUIET + 1)) ;;
              *) O_DORMANT=$((O_DORMANT + 1)) ;;
            esac
            O_COMMITS_6M=$((O_COMMITS_6M + ${M_TOTAL:-0}))
            O_OPEN_PRS=$((O_OPEN_PRS + ${M_PRS:-0}))
            IFS=',' read -r -a M_LIST <<< "$M_COUNTS"
            for i in "${!M_LIST[@]}"; do
              O_MONTHS[$i]=$(( O_MONTHS[$i] + ${M_LIST[$i]:-0} ))
              ALL_MONTH_TOTALS[$i]=$(( ALL_MONTH_TOTALS[$i] + ${M_LIST[$i]:-0} ))
            done
            IFS=',' read -r -a W_LIST <<< "$M_WEEKS"
            for w in "${W_LIST[@]}"; do
              O_COMMITS_6W=$((O_COMMITS_6W + ${w:-0}))
            done
          done < "$MAIN_FILE"

          O_IMP_BRANCHES=0
          O_IMP_REPOS=0
          if [ -s "$BRANCHES_FILE" ]; then
            O_IMP_BRANCHES=$(awk -F'|' -v o="$OWNER" '$1 == o { c++ } END { print c+0 }' "$BRANCHES_FILE")
            O_IMP_REPOS=$(awk -F'|' -v o="$OWNER" '$1 == o { print $2 }' "$BRANCHES_FILE" | sort -u | sed '/^\s*$/d' | wc -l | tr -d ' ')
          fi

          O_COUNTS_CSV=$(IFS=','; echo "${O_MONTHS[*]}")
          O_SPARK=$(sparkline "$O_COUNTS_CSV")
          if [ "$O_IMP_BRANCHES" -gt 0 ]; then
            IMP_CELL="${O_IMP_BRANCHES} (${O_IMP_REPOS} repos)"
          else
            IMP_CELL="0"
          fi

          TABLE_ROWS+=("| [${OWNER}](https://github.com/${OWNER}) | ${TYPE_BADGE} | ${O_REPOS} | ${O_ACTIVE} | ${O_QUIET} | ${O_DORMANT} | \`${O_SPARK}\` | ${O_COMMITS_6M} | ${O_COMMITS_6W} | ${O_OPEN_PRS} | ${IMP_CELL} |")

          OWNER_LABELS+=("$OWNER")
          OWNER_COMMITS+=("$O_COMMITS_6M")
          if [ "$O_COMMITS_6M" -gt "$OWNER_PEAK" ]; then OWNER_PEAK="$O_COMMITS_6M"; fi

          TOT_REPOS=$((TOT_REPOS + O_REPOS))
          TOT_ACTIVE=$((TOT_ACTIVE + O_ACTIVE))
          TOT_QUIET=$((TOT_QUIET + O_QUIET))
          TOT_DORMANT=$((TOT_DORMANT + O_DORMANT))
          TOT_COMMITS_6M=$((TOT_COMMITS_6M + O_COMMITS_6M))
          TOT_COMMITS_6W=$((TOT_COMMITS_6W + O_COMMITS_6W))
          TOT_OPEN_PRS=$((TOT_OPEN_PRS + O_OPEN_PRS))
          TOT_IMP_BRANCHES=$((TOT_IMP_BRANCHES + O_IMP_BRANCHES))
          TOT_IMP_REPOS=$((TOT_IMP_REPOS + O_IMP_REPOS))
        done < "$OWNER_COUNTS_FILE"

        ALL_COUNTS_CSV=$(IFS=','; echo "${ALL_MONTH_TOTALS[*]}")
        ALL_SPARK=$(sparkline "$ALL_COUNTS_CSV")
        if [ "$TOT_IMP_BRANCHES" -gt 0 ]; then
          TOT_IMP_CELL="**${TOT_IMP_BRANCHES} (${TOT_IMP_REPOS} repos)**"
        else
          TOT_IMP_CELL="**0**"
        fi

        OWNER_Y_MAX=$(( OWNER_PEAK + (OWNER_PEAK + 4) / 5 ))
        if [ "$OWNER_Y_MAX" -lt 4 ]; then OWNER_Y_MAX=4; fi
        OWNER_X_AXIS=$(printf '"%s", ' "${OWNER_LABELS[@]}"); OWNER_X_AXIS="[${OWNER_X_AXIS%, }]"
        OWNER_SERIES=$(printf '%s, ' "${OWNER_COMMITS[@]}"); OWNER_SERIES="[${OWNER_SERIES%, }]"

        {
          echo "### Multi-Owner Overview"
          echo ""
          echo "Consolidated breakdown across ${OWNER_COUNT} owners (${USER_COUNT} personal account(s), ${ORG_COUNT} organization(s)):"
          echo ""
          echo "| Owner | Type | Repos | ✨ Active | 🌙 Quiet | 💤 Dormant | Trend (${MONTHS[0]} → ${MONTHS[$((N_MONTHS - 1))]}) | Commits (${N_MONTHS}m) | Commits (${N_WEEKS}w) | Open PRs | Improvement branches |"
          echo "| --- | --- | ---: | ---: | ---: | ---: | --- | ---: | ---: | ---: | ---: |"
          for row in "${TABLE_ROWS[@]}"; do
            echo "$row"
          done
          echo "| **Total** | **${OWNER_COUNT} owners** | **${TOT_REPOS}** | **${TOT_ACTIVE}** | **${TOT_QUIET}** | **${TOT_DORMANT}** | \`${ALL_SPARK}\` | **${TOT_COMMITS_6M}** | **${TOT_COMMITS_6W}** | **${TOT_OPEN_PRS}** | ${TOT_IMP_CELL} |"
          echo ""
          echo '```mermaid'
          echo "xychart-beta"
          echo "    title \"Commits to default branches by owner (last ${N_MONTHS} months)\""
          echo "    x-axis ${OWNER_X_AXIS}"
          echo "    y-axis \"Commits\" 0 --> ${OWNER_Y_MAX}"
          echo "    bar ${OWNER_SERIES}"
          echo '```'
          echo ""
        } > "$SECTION_FILE"
        log INFO "Rendered multi-owner overview for ${OWNER_COUNT} owners"

    - name: Render main branch trend
      if: steps.enumerate.outputs.status == 'has_repos'
      shell: bash
      run: |
        set -Eeuo pipefail
        MAIN_FILE="$RUNNER_TEMP/main_activity.txt"
        SECTION_FILE="$RUNNER_TEMP/main_section.md"
        : > "$SECTION_FILE"
        [ -s "$MAIN_FILE" ] || { log WARN "No main branch activity collected"; exit 0; }
        mapfile -t MONTHS < "$RUNNER_TEMP/trend_months.txt"
        mapfile -t WEEKS < "$RUNNER_TEMP/trend_weeks.txt"
        N_MONTHS=${#MONTHS[@]}
        N_WEEKS=${#WEEKS[@]}

        # Totals across all repos
        declare -A ACT_COUNT=([active]=0 [quiet]=0 [dormant]=0 [unknown]=0)
        MONTH_TOTALS=()
        WEEK_TOTALS=()
        for ((i = 0; i < N_MONTHS; i++)); do MONTH_TOTALS+=(0); done
        for ((i = 0; i < N_WEEKS; i++)); do WEEK_TOTALS+=(0); done
        OPEN_PRS_TOTAL=0
        REPO_COUNT=0
        ROWS_FILE="$RUNNER_TEMP/main_rows.txt"
        : > "$ROWS_FILE"

        while IFS='|' read -r OWNER REPO BRANCH VIS LAST_COMMIT DAYS ACTIVITY OPEN_PRS TOTAL COUNTS LAST_MERGED WEEK_COUNTS; do
          [ -z "$REPO" ] && continue
          REPO_COUNT=$((REPO_COUNT + 1))
          ACT_COUNT[$ACTIVITY]=$(( ${ACT_COUNT[$ACTIVITY]:-0} + 1 ))
          OPEN_PRS_TOTAL=$((OPEN_PRS_TOTAL + ${OPEN_PRS:-0}))
          IFS=',' read -r -a COUNT_LIST <<< "$COUNTS"
          for i in "${!COUNT_LIST[@]}"; do
            MONTH_TOTALS[$i]=$(( MONTH_TOTALS[$i] + ${COUNT_LIST[$i]:-0} ))
          done
          IFS=',' read -r -a WEEK_COUNT_LIST <<< "$WEEK_COUNTS"
          for i in "${!WEEK_COUNT_LIST[@]}"; do
            WEEK_TOTALS[$i]=$(( WEEK_TOTALS[$i] + ${WEEK_COUNT_LIST[$i]:-0} ))
          done
          # Sort key: active/quiet first (most commits, then most recent), dormant/unknown after
          GROUP=0
          case "$ACTIVITY" in dormant|unknown) GROUP=1 ;; esac
          echo "${GROUP}|${TOTAL:-0}|${DAYS:-99999}|${OWNER}|${REPO}|${BRANCH}|${LAST_COMMIT}|${DAYS}|${ACTIVITY}|${OPEN_PRS:-0}|${COUNTS}|${LAST_MERGED}|${WEEK_COUNTS:-}" >> "$ROWS_FILE"
        done < "$MAIN_FILE"
        sort -t'|' -k1,1n -k2,2nr -k3,3n -o "$ROWS_FILE" "$ROWS_FILE"

        WINDOW_TOTAL=0
        PEAK=1
        for t in "${MONTH_TOTALS[@]}"; do
          WINDOW_TOTAL=$((WINDOW_TOTAL + t))
          if [ "$t" -gt "$PEAK" ]; then PEAK="$t"; fi
        done
        X_AXIS=$(printf '"%s", ' "${MONTHS[@]}"); X_AXIS="[${X_AXIS%, }]"
        SERIES=$(printf '%s, ' "${MONTH_TOTALS[@]}"); SERIES="[${SERIES%, }]"
        WEEK_X_LABELS=()
        for week in "${WEEKS[@]}"; do
          WEEK_X_LABELS+=("$(LC_ALL=C date -u -d "$week" +"W%V · %b %d")")
        done
        WEEK_WINDOW_TOTAL=0
        WEEK_PEAK_VAL=0
        WEEK_PEAK_IDX=0
        for i in "${!WEEK_TOTALS[@]}"; do
          t="${WEEK_TOTALS[$i]}"
          WEEK_WINDOW_TOTAL=$((WEEK_WINDOW_TOTAL + t))
          if [ "$t" -ge "$WEEK_PEAK_VAL" ]; then
            WEEK_PEAK_VAL="$t"
            WEEK_PEAK_IDX="$i"
          fi
        done
        WEEK_Y_MAX=$(( WEEK_PEAK_VAL + (WEEK_PEAK_VAL + 4) / 5 ))
        if [ "$WEEK_Y_MAX" -lt 4 ]; then WEEK_Y_MAX=4; fi
        CURRENT_ISO_WEEK=$(LC_ALL=C date -u -d "${WEEKS[$((N_WEEKS - 1))]}" +W%V)
        THIS_WEEK_COMMITS="${WEEK_TOTALS[$((N_WEEKS - 1))]}"
        WEEK_SUMMARY_LINE="- Commits in the last ${N_WEEKS} weeks: ${WEEK_WINDOW_TOTAL} · This week so far (\`${CURRENT_ISO_WEEK}\`): ${THIS_WEEK_COMMITS}"
        if [ "$N_WEEKS" -ge 2 ]; then
          PREV_ISO_WEEK=$(LC_ALL=C date -u -d "${WEEKS[$((N_WEEKS - 2))]}" +W%V)
          PREV_WEEK_COMMITS="${WEEK_TOTALS[$((N_WEEKS - 2))]}"
          WEEK_SUMMARY_LINE+=" · Last full week (\`${PREV_ISO_WEEK}\`): ${PREV_WEEK_COMMITS}"
        fi
        if [ "$WEEK_WINDOW_TOTAL" -gt 0 ]; then
          WEEK_SUMMARY_LINE+=" · Peak week: ${WEEK_PEAK_VAL} (\`${WEEK_X_LABELS[$WEEK_PEAK_IDX]}\`)"
        fi
        WEEK_X_AXIS=$(printf '"%s", ' "${WEEK_X_LABELS[@]}"); WEEK_X_AXIS="[${WEEK_X_AXIS%, }]"
        WEEK_SERIES=$(printf '%s, ' "${WEEK_TOTALS[@]}"); WEEK_SERIES="[${WEEK_SERIES%, }]"

        table_header() {
          echo "| Repo | Branch | Activity | Last commit | Trend (${MONTHS[0]} → ${MONTHS[$((N_MONTHS - 1))]}) | Commits | Open PRs | Last merged PR |"
          echo "| --- | --- | --- | --- | --- | ---: | ---: | --- |"
        }
        table_row() {
          local owner="$1" repo="$2" branch="$3" last="$4" days="$5" activity="$6" prs="$7" counts="$8" merged="$9" total="${10}"
          local last_text="–" merged_text="–" label
          label=$(repo_label "$owner" "$repo")
          if [ -n "$last" ]; then last_text="$(days_ago "$days") (${last:0:10})"; fi
          if [ -n "$merged" ] && [ "$merged" != "none" ]; then
            merged_text=$(days_ago "$(days_since "$merged")")
          fi
          echo "| [${label}](https://github.com/${owner}/${repo}) | [\`${branch}\`](https://github.com/${owner}/${repo}/commits/${branch}) | $(activity_label "$activity") | ${last_text} | \`$(sparkline "$counts")\` | ${total} | ${prs} | ${merged_text} |"
        }

        {
          echo "### Main branches across all repos"
          echo ""
          echo "- Repos: ${REPO_COUNT} · ✨ Active: ${ACT_COUNT[active]} · 🌙 Quiet: ${ACT_COUNT[quiet]} · 💤 Dormant: ${ACT_COUNT[dormant]} · ❔ Unknown: ${ACT_COUNT[unknown]}"
          echo "- Commits to default branches in the last ${N_MONTHS} months: ${WINDOW_TOTAL} (this month so far: ${MONTH_TOTALS[$((N_MONTHS - 1))]})"
          echo "- Open PRs targeting default branches: ${OPEN_PRS_TOTAL}"
          echo ""
          echo "Activity legend (last commit on the default branch): ✨ Active: last 30 days · 🌙 Quiet: 31–90 days · 💤 Dormant: over 90 days · ❔ Unknown: empty repo or no access"
          echo ""
          echo '```mermaid'
          echo "xychart-beta"
          echo "    title \"Commits to default branches, all repos (${MONTHS[$((N_MONTHS - 1))]} is month to date)\""
          echo "    x-axis ${X_AXIS}"
          echo "    y-axis \"Commits\" 0 --> ${PEAK}"
          echo "    bar ${SERIES}"
          echo "    line ${SERIES}"
          echo '```'
          echo ""
          echo "### Commits to default branches by week, all repos"
          echo ""
          echo "Short-term delivery cadence across all default branches over the last ${N_WEEKS} ISO weeks (\`${WEEK_X_LABELS[0]}\` → \`${WEEK_X_LABELS[$((N_WEEKS - 1))]}\`). Each bar aggregates commits from Monday \`00:00 UTC\` to Sunday \`23:59 UTC\` (labeled with its Monday start date), and the trend line tracks week-over-week momentum; \`${CURRENT_ISO_WEEK}\` reflects the current week to date."
          echo ""
          echo "${WEEK_SUMMARY_LINE}"
          echo ""
          echo '```mermaid'
          echo "---"
          echo "config:"
          echo "  xyChart:"
          echo "    width: 900"
          echo "    height: 320"
          echo "    titleFontSize: 16"
          echo "    xAxis:"
          echo "      labelFontSize: 12"
          echo "      labelPadding: 6"
          echo "    yAxis:"
          echo "      labelFontSize: 12"
          echo "      titleFontSize: 13"
          echo "---"
          echo "xychart-beta"
          echo "    title \"Commits to default branches by week, all repos (${CURRENT_ISO_WEEK} is week to date)\""
          echo "    x-axis ${WEEK_X_AXIS}"
          echo "    y-axis \"Commits\" 0 --> ${WEEK_Y_MAX}"
          echo "    bar ${WEEK_SERIES}"
          echo "    line ${WEEK_SERIES}"
          echo '```'
          echo ""

          # Share of commits per repo: top 8, the rest grouped
          if [ "$WINDOW_TOTAL" -gt 0 ]; then
            echo '```mermaid'
            echo "pie showData"
            echo "    title Share of commits to default branches (last ${N_MONTHS} months)"
            OTHER=0
            RANK=0
            while IFS='|' read -r _ TOTAL _ OWNER REPO _; do
              [ "${TOTAL:-0}" -gt 0 ] || continue
              RANK=$((RANK + 1))
              LABEL=$(repo_label "$OWNER" "$REPO")
              if [ "$RANK" -le 8 ]; then
                echo "    \"${LABEL}\" : ${TOTAL}"
              else
                OTHER=$((OTHER + TOTAL))
              fi
            done < <(sort -t'|' -k2,2nr "$ROWS_FILE")
            if [ "$OTHER" -gt 0 ]; then echo "    \"Other repos\" : ${OTHER}"; fi
            echo '```'
            echo ""
          fi

          table_header
          while IFS='|' read -r GROUP TOTAL _ OWNER REPO BRANCH LAST DAYS ACTIVITY PRS COUNTS MERGED WEEK_COUNTS; do
            if [ "$GROUP" = "0" ]; then
              table_row "$OWNER" "$REPO" "$BRANCH" "$LAST" "$DAYS" "$ACTIVITY" "$PRS" "$COUNTS" "$MERGED" "$TOTAL"
            fi
          done < "$ROWS_FILE"
          echo ""

          IDLE_COUNT=$(( ${ACT_COUNT[dormant]} + ${ACT_COUNT[unknown]} ))
          if [ "$IDLE_COUNT" -gt 0 ]; then
            echo "<details><summary>💤 ${IDLE_COUNT} dormant or unknown repos</summary>"
            echo ""
            table_header
            while IFS='|' read -r GROUP TOTAL _ OWNER REPO BRANCH LAST DAYS ACTIVITY PRS COUNTS MERGED WEEK_COUNTS; do
              if [ "$GROUP" = "1" ]; then
                table_row "$OWNER" "$REPO" "$BRANCH" "$LAST" "$DAYS" "$ACTIVITY" "$PRS" "$COUNTS" "$MERGED" "$TOTAL"
              fi
            done < "$ROWS_FILE"
            echo ""
            echo "</details>"
            echo ""
          fi
        } > "$SECTION_FILE"
        log INFO "Rendered main branch trend for ${REPO_COUNT} repos"

    - name: Summary with Github repos
      if: steps.enumerate.outputs.status == 'has_repos'
      shell: bash
      run: |
        COUNT="${{ steps.enumerate.outputs.count }}"
        IMP="${{ steps.process.outputs.improvements_count }}"
        CURRENT_MONTH=$(LC_ALL=C date +"%B %Y")
        PREV_REPOS_FILE="$RUNNER_TEMP/prev_month_improvement_repos.txt"
        DETAILS_FILE="$RUNNER_TEMP/branch_details.txt"
        CLEANUP_FILE="$RUNNER_TEMP/cleanup_candidates.txt"
        SYNC_FILE="$RUNNER_TEMP/sync_candidates.txt"
        MULTI_OWNER_SECTION_FILE="$RUNNER_TEMP/multi_owner_section.md"
        MAIN_SECTION_FILE="$RUNNER_TEMP/main_section.md"
        THRESHOLD="${OPT_BEHIND_THRESHOLD:-10}"
        # A copy of the summary is kept as report.md in the exported artifact
        REPORT_DIR="$RUNNER_TEMP/repos-report"
        mkdir -p "$REPORT_DIR"

        ACTIVE_OPTIONS=()
        [ "${FULL_REPORT:-false}" = "true" ] && ACTIVE_OPTIONS+=("Full report")
        [ "${OPT_ONLY_OPEN_PRS:-false}" = "true" ] && ACTIVE_OPTIONS+=("Report only Open PRs")
        [ "${OPT_STALE_AGE:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("Stale Branch Age Tracking")
        [ "${OPT_PR_STATUS:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("PR Status & Direct Links")
        [ "${OPT_DIFF_LINKS:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("Direct Diff & Comparison Deep-Links")
        [ "${OPT_BEHIND_MAIN:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("Behind-Main & Conflict Risk Indicators")
        [ "${OPT_CLEANUP_DISPATCH:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("Interactive Automated Cleanup Dispatch")

        OPTIONS_STR=""
        if [ ${#ACTIVE_OPTIONS[@]} -eq 0 ]; then
          OPTIONS_STR="Standard report"
        else
          OPTIONS_STR=$(IFS=', '; echo "${ACTIVE_OPTIONS[*]}")
        fi

        HAS_ENRICHED=false
        if [ "${OPT_STALE_AGE:-false}" = "true" ] || [ "${OPT_PR_STATUS:-false}" = "true" ] || [ "${OPT_DIFF_LINKS:-false}" = "true" ] || [ "${OPT_BEHIND_MAIN:-false}" = "true" ]; then
          HAS_ENRICHED=true
        fi

        {
          echo "### www.andres.nz Github Repos summary"
          echo ""
          if [ "${MULTI_OWNER:-false}" = "true" ]; then
            echo "- Owners (${OWNER_COUNT}): ${OWNERS_DISPLAY}"
          else
            echo "- Org: ${OWNERS_DISPLAY}"
          fi
          echo "- Selected repos: ${COUNT}"
          echo "- Repos with improvement branches: ${IMP}"
          echo "- Reporting tweaks: ${OPTIONS_STR}"
          echo ""
          if [ -s "$MULTI_OWNER_SECTION_FILE" ]; then
            cat "$MULTI_OWNER_SECTION_FILE"
          fi
          if [ -s "$MAIN_SECTION_FILE" ]; then
            cat "$MAIN_SECTION_FILE"
          fi
          echo "### Repos with improvement branches from previous months"
          echo ""
          echo "Current month: ${CURRENT_MONTH}"
          echo ""
          if [ "${OPT_STALE_AGE:-false}" = "true" ]; then
            echo "Branch age legend (time since last commit): 🟢 Active: under 14 days · 🟡 Stale: 14–30 days · 🔴 Abandoned: over 30 days"
            echo ""
          fi
          if [ "${OPT_PR_STATUS:-false}" = "true" ]; then
            echo "PR status legend: 🔀 Open · 📝 Draft · 🟣 Merged · 🚫 Closed · ➕ No PR yet. Open PR reviews: ✅ approved · ❌ changes requested · 👀 awaiting review"
            echo ""
          fi
          if [ "${OPT_BEHIND_MAIN:-false}" = "true" ]; then
            echo "Conflict risk legend (commits behind the default branch): Low: 1–${THRESHOLD} · ⚠️ High: $((THRESHOLD + 1))–$((THRESHOLD * 5)) · 🚨 Very high: over $((THRESHOLD * 5)). Branches with no new commits have no conflict risk."
            echo ""
          fi
          if [ -s "$PREV_REPOS_FILE" ]; then
            INDEX=1
            while IFS='|' read -r P_OWNER P_REPO; do
              [ -z "$P_REPO" ] && continue
              P_LABEL=$(repo_label "$P_OWNER" "$P_REPO")
              echo "${INDEX}. [${P_LABEL}](https://github.com/${P_OWNER}/${P_REPO})"
              INDEX=$((INDEX + 1))

              if [ "$HAS_ENRICHED" = true ] && [ -f "$DETAILS_FILE" ]; then
                while IFS='|' read -r D_OWNER D_REPO D_BR D_AGE D_PR D_DIFF D_BEHIND; do
                  if [ "$D_OWNER" != "$P_OWNER" ] || [ "$D_REPO" != "$P_REPO" ]; then
                    continue
                  fi
                  TAGS=()
                  [ -n "$D_AGE" ] && TAGS+=("$D_AGE")
                  [ -n "$D_PR" ] && TAGS+=("$D_PR")
                  [ -n "$D_DIFF" ] && TAGS+=("$D_DIFF")
                  [ -n "$D_BEHIND" ] && TAGS+=("$D_BEHIND")

                  TAG_LINE=""
                  if [ ${#TAGS[@]} -gt 0 ]; then
                    JOINED=$(printf ' | %s' "${TAGS[@]}")
                    TAG_LINE=" (${JOINED:3})"
                  fi
                  echo "   - \`${D_BR}\`${TAG_LINE}"
                done < "$DETAILS_FILE"
              fi
            done < "$PREV_REPOS_FILE"
          else
            echo "No repositories found with improvement branches from previous months."
          fi

          echo ""
          echo "## Recommended Next Steps"
          echo ""
          if [ "${OPT_CLEANUP_DISPATCH:-false}" = "true" ]; then
            echo "### Interactive Automated Cleanup Dispatch"
            echo ""
            if [ -s "$CLEANUP_FILE" ]; then
              echo "The following improvement branches from **previous months** have 0 commits ahead or are already merged and can safely be deleted (current month branches are preserved):"
              echo ""
              while IFS='|' read -r C_OWNER C_REPO C_BR C_AHEAD C_STATE; do
                [ -z "$C_REPO" ] && continue
                C_LABEL=$(repo_label "$C_OWNER" "$C_REPO")
                REASON="0 ahead"
                [ "$C_STATE" = "MERGED" ] && REASON="merged"
                echo "- **${C_LABEL}**: \`${C_BR}\` (${REASON})"
                echo "  \`\`\`bash"
                echo "  gh api --method DELETE -H \"Accept: application/vnd.github+json\" -H \"X-GitHub-Api-Version: 2026-03-10\" repos/${C_OWNER}/${C_REPO}/git/refs/heads/${C_BR}"
                echo "  \`\`\`"
              done < "$CLEANUP_FILE"
            else
              echo "_No stale improvement branches from previous months are eligible for cleanup at this time (current month branches are preserved)._"
            fi
          else
            echo "- Review qualifying improvement pull requests and merge completed cycles into \`main\`."
            echo "- Run this workflow with \`cleanup_dispatch=true\` (or \`full_report=true\`) to generate cleanup commands for prior months' branches."
          fi

          if [ "${OPT_BEHIND_MAIN:-false}" = "true" ]; then
            echo ""
            echo "### Sync branches at conflict risk"
            echo ""
            if [ -s "$SYNC_FILE" ]; then
              echo "These improvement branches are more than ${THRESHOLD} commits behind their default branch. Merge the default branch into them now, while conflicts are still small:"
              echo ""
              while IFS='|' read -r S_OWNER S_REPO S_BR S_BASE S_BEHIND S_AHEAD; do
                [ -z "$S_REPO" ] && continue
                S_LABEL=$(repo_label "$S_OWNER" "$S_REPO")
                echo "- **${S_LABEL}**: \`${S_BR}\` (${S_BEHIND} behind \`${S_BASE}\`, ${S_AHEAD} ahead)"
                echo "  \`\`\`bash"
                echo "  gh api --method POST -H \"Accept: application/vnd.github+json\" -H \"X-GitHub-Api-Version: 2026-03-10\" repos/${S_OWNER}/${S_REPO}/merges -f base=${S_BR} -f head=${S_BASE}"
                echo "  \`\`\`"
              done < "$SYNC_FILE"
              echo ""
              echo "_A \`409 Merge conflict\` response means the branch has real conflicts: merge or rebase it locally instead._"
            else
              echo "_No improvement branches with new commits are more than ${THRESHOLD} commits behind their default branch._"
            fi
          fi

          echo ""
          echo "_Report options and roadmap: [.github/readme.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/.github/readme.md#future-work)_"
        } | tee "$REPORT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Export report data (JSON/CSV)
      if: steps.enumerate.outputs.status == 'has_repos'
      shell: bash
      run: |
        set -Eeuo pipefail
        REPORT_DIR="$RUNNER_TEMP/repos-report"
        mkdir -p "$REPORT_DIR"
        MAIN_FILE="$RUNNER_TEMP/main_activity.txt"
        BRANCHES_RAW_FILE="$RUNNER_TEMP/branches_raw.txt"
        touch "$MAIN_FILE" "$BRANCHES_RAW_FILE"
        GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        MONTHS_JSON=$(jq -R . "$RUNNER_TEMP/trend_months.txt" | jq -s -c .)
        WEEKS_JSON=$(jq -R . "$RUNNER_TEMP/trend_weeks.txt" | jq -s -c .)
        OWNERS_JSON=$(jq -R . "$RUNNER_TEMP/owners.txt" | jq -s -c .)

        # Raw data -> JSON (pipe-delimited files written by phases 3 and 4)
        jq -R -s -c --argjson months "$MONTHS_JSON" --argjson weeks "$WEEKS_JSON" '
          split("\n") | map(select(length > 0) | split("|")) | map({
            owner: .[0], repo: .[1], default_branch: .[2], visibility: .[3],
            last_commit_at: (if .[4] == "" then null else .[4] end),
            days_since_last_commit: (.[5] | tonumber? // null),
            activity: .[6],
            open_prs_to_default: (.[7] | tonumber? // 0),
            commits_in_window: (.[8] | tonumber? // 0),
            commits_by_month: ([$months, (.[9] // "" | split(","))] | transpose
              | map(select(.[0] != null) | {(.[0]): (.[1] // "0" | tonumber? // 0)}) | add // {}),
            commits_by_week: ([$weeks, (.[11] // "" | split(","))] | transpose
              | map(select(.[0] != null) | {(.[0]): (.[1] // "0" | tonumber? // 0)}) | add // {}),
            last_pr_merged_at: (if .[10] == "" or .[10] == "none" then null else .[10] end)
          })' "$MAIN_FILE" > "$REPORT_DIR/main_branches.json"

        jq -R -s -c '
          split("\n") | map(select(length > 0) | split("|")) | map({
            owner: .[0], repo: .[1], default_branch: .[2], branch: .[3],
            from_previous_month: (.[4] == "true"),
            ahead_by: (.[5] | tonumber? // null),
            behind_by: (.[6] | tonumber? // null),
            last_commit_at: (if .[7] == "" then null else .[7] end),
            pr_number: (.[8] | tonumber? // null),
            pr_state: (if .[9] == "" then null else .[9] end),
            conflict_risk: (if .[10] == "" then null else .[10] end)
          })' "$BRANCHES_RAW_FILE" > "$REPORT_DIR/improvement_branches.json"

        # CSV: one row per repo (wide), one row per repo per month (long, for trend tools), one row per branch
        jq -r --argjson months "$MONTHS_JSON" '
          (["owner","repo","default_branch","visibility","last_commit_at","days_since_last_commit","activity",
            "open_prs_to_default","last_pr_merged_at","commits_last_\($months | length)_months"]
            + ($months | map("commits_" + .))),
          (.[] | [.owner, .repo, .default_branch, .visibility, .last_commit_at, .days_since_last_commit, .activity,
                  .open_prs_to_default, .last_pr_merged_at, .commits_in_window]
                 + [.commits_by_month[$months[]]])
          | @csv' "$REPORT_DIR/main_branches.json" > "$REPORT_DIR/main_branches.csv"

        jq -r --arg date "${GENERATED_AT:0:10}" '
          ["report_date","owner","repo","default_branch","month","commits"],
          (.[] | . as $r | .commits_by_month | to_entries[] | [$date, $r.owner, $r.repo, $r.default_branch, .key, .value])
          | @csv' "$REPORT_DIR/main_branches.json" > "$REPORT_DIR/main_commits_monthly.csv"

        jq -r --arg date "${GENERATED_AT:0:10}" '
          ["report_date","owner","repo","default_branch","week_start_monday","week","commits"],
          (.[] | . as $r | .commits_by_week | to_entries[] |
            [$date, $r.owner, $r.repo, $r.default_branch, .key,
             (.key | strptime("%Y-%m-%d") | mktime | strftime("%G-W%V")), .value])
          | @csv' "$REPORT_DIR/main_branches.json" > "$REPORT_DIR/main_commits_weekly.csv"

        jq -r '
          ["owner","repo","default_branch","branch","from_previous_month","ahead_by","behind_by",
           "last_commit_at","pr_number","pr_state","conflict_risk"],
          (.[] | [.owner, .repo, .default_branch, .branch, (.from_previous_month | tostring), .ahead_by, .behind_by,
                  .last_commit_at, .pr_number, .pr_state, .conflict_risk])
          | @csv' "$REPORT_DIR/improvement_branches.json" > "$REPORT_DIR/improvement_branches.csv"

        # Aggregated metrics + run metadata
        jq -n \
          --arg generated_at "$GENERATED_AT" \
          --arg owner "$OWNERS_CSV" \
          --argjson owners "$OWNERS_JSON" \
          --arg run_id "${GITHUB_RUN_ID}" \
          --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          --argjson months "$MONTHS_JSON" \
          --argjson weeks "$WEEKS_JSON" \
          --argjson options "$(jq -n \
            --arg full_report "${FULL_REPORT:-false}" --arg only_open_prs "${OPT_ONLY_OPEN_PRS:-false}" \
            --arg stale_branch_age "${OPT_STALE_AGE:-false}" --arg pr_status "${OPT_PR_STATUS:-false}" \
            --arg diff_links "${OPT_DIFF_LINKS:-false}" --arg behind_main "${OPT_BEHIND_MAIN:-false}" \
            --arg behind_threshold "${OPT_BEHIND_THRESHOLD:-10}" --arg cleanup_dispatch "${OPT_CLEANUP_DISPATCH:-false}" \
            '$ARGS.named | with_entries(.value |= (if . == "true" then true elif . == "false" then false else (tonumber? // .) end))')" \
          --slurpfile repos "$REPORT_DIR/main_branches.json" \
          --slurpfile branches "$REPORT_DIR/improvement_branches.json" '
          $repos[0] as $r | $branches[0] as $b | {
            generated_at: $generated_at,
            owner: $owner,
            owners: $owners,
            run: {id: $run_id, url: $run_url},
            options: $options,
            trend_months: $months,
            trend_weeks: $weeks,
            totals: {
              repos: ($r | length),
              main_activity: ({active: 0, quiet: 0, dormant: 0, unknown: 0}
                + ($r | group_by(.activity) | map({(.[0].activity): length}) | add // {})),
              main_commits_by_month: ($months | map(. as $m | {($m): ($r | map(.commits_by_month[$m] // 0) | add // 0)}) | add // {}),
              main_commits_by_week: ($weeks | map(. as $w | {($w): ($r | map(.commits_by_week[$w] // 0) | add // 0)}) | add // {}),
              open_prs_to_default: ($r | map(.open_prs_to_default) | add // 0),
              repos_with_improvement_branches: ($b | map("\(.owner)/\(.repo)") | unique | length),
              improvement_branches: ($b | length),
              improvement_branches_at_conflict_risk: ($b | map(select(.conflict_risk == "high" or .conflict_risk == "very_high")) | length)
            },
            by_owner: ($owners | map(. as $o
              | ($r | map(select(.owner == $o))) as $or
              | ($b | map(select(.owner == $o))) as $ob
              | {($o): {
                  repos: ($or | length),
                  main_activity: ({active: 0, quiet: 0, dormant: 0, unknown: 0}
                    + ($or | group_by(.activity) | map({(.[0].activity): length}) | add // {})),
                  main_commits_by_month: ($months | map(. as $m | {($m): ($or | map(.commits_by_month[$m] // 0) | add // 0)}) | add // {}),
                  main_commits_by_week: ($weeks | map(. as $w | {($w): ($or | map(.commits_by_week[$w] // 0) | add // 0)}) | add // {}),
                  open_prs_to_default: ($or | map(.open_prs_to_default) | add // 0),
                  repos_with_improvement_branches: ($ob | map(.repo) | unique | length),
                  improvement_branches: ($ob | length),
                  improvement_branches_at_conflict_risk: ($ob | map(select(.conflict_risk == "high" or .conflict_risk == "very_high")) | length)
                }}
            ) | add // {})
          }' > "$REPORT_DIR/summary.json"

        log INFO "Exported report data to ${REPORT_DIR}:"
        ls -la "$REPORT_DIR"

    - name: Upload report artifact
      id: upload_report
      if: steps.enumerate.outputs.status == 'has_repos'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: repos-report-${{ steps.options.outputs.artifact_slug }}
        path: ${{ runner.temp }}/repos-report/
        retention-days: 90
        overwrite: true
        if-no-files-found: warn

    - name: Link report artifact in summary
      if: steps.upload_report.outputs.artifact-url != ''
      env:
        ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
      shell: bash
      run: |
        {
          echo ""
          echo "📦 [Download the report data](${ARTIFACT_URL}) (JSON/CSV and this summary as \`report.md\`, kept for 90 days)"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Summary No repos
      if: steps.enumerate.outputs.status == 'no_repos'
      shell: bash
      run: |
        CURRENT_MONTH=$(LC_ALL=C date +"%B %Y")
        ACTIVE_OPTIONS=()
        [ "${FULL_REPORT:-false}" = "true" ] && ACTIVE_OPTIONS+=("Full report")
        [ "${OPT_ONLY_OPEN_PRS:-false}" = "true" ] && ACTIVE_OPTIONS+=("Report only Open PRs")
        [ "${OPT_STALE_AGE:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("Stale Branch Age Tracking")
        [ "${OPT_PR_STATUS:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("PR Status & Direct Links")
        [ "${OPT_DIFF_LINKS:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("Direct Diff & Comparison Deep-Links")
        [ "${OPT_BEHIND_MAIN:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("Behind-Main & Conflict Risk Indicators")
        [ "${OPT_CLEANUP_DISPATCH:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("Interactive Automated Cleanup Dispatch")

        OPTIONS_STR=""
        if [ ${#ACTIVE_OPTIONS[@]} -eq 0 ]; then
          OPTIONS_STR="Standard report"
        else
          OPTIONS_STR=$(IFS=', '; echo "${ACTIVE_OPTIONS[*]}")
        fi

        {
          echo "### www.andres.nz Github Repos summary"
          echo ""
          if [ "${MULTI_OWNER:-false}" = "true" ]; then
            echo "- Owners (${OWNER_COUNT}): ${OWNERS_DISPLAY}"
          else
            echo "- Org: ${OWNERS_DISPLAY}"
          fi
          echo "- No repositories matched the selection."
          echo "- Reporting tweaks: ${OPTIONS_STR}"
          echo ""
          echo "### Repos with improvement branches from previous months"
          echo ""
          echo "Current month: ${CURRENT_MONTH}"
          echo ""
          echo ""
          echo "## Recommended Next Steps"
          echo ""
          echo "- Verify the owner/organization name(s) (\`${OWNERS_DISPLAY}\`) and repository permissions."
          echo "- Ensure the GitHub token has required read scopes across organization repositories."
          echo ""
          echo "_Report options and roadmap: [.github/readme.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/.github/readme.md#future-work)_"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Diagnostics (optional, read-only)
      if: ${{ inputs.debug == 'true' }}
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      shell: bash
      run: |
        echo "================= GitHub REST API docs: https://docs.github.com/en/rest"
        gh api --verbose "repos/${GITHUB_REPOSITORY}/branches" || echo "Verbose output unavailable"
        echo "================= completed verbose API call for branch diagnostics repo ${GITHUB_REPOSITORY}"
