name: "Report Repos"
description: "Reports across repositories in an organization"
inputs:
  repo_filter:
    description: "Optional substring to filter repositories (case-insensitive)"
    required: false
    default: ""
  branch_pattern:
    description: "Regex for improvement branches (grep -E)"
    required: false
    default: "-improvements$"
  org_name:
    description: "Organization name"
    required: true
  gh_token:
    description: "GitHub token"
    required: true
  full_report:
    description: "Enable full report (all features)"
    required: false
    default: "true"
  report_only_open_prs:
    description: "Filter report to only open PRs"
    required: false
    default: "false"
  stale_branch_age:
    description: "Include stale branch age tracking"
    required: false
    default: "false"
  pr_status:
    description: "Include PR status & direct links"
    required: false
    default: "false"
  diff_links:
    description: "Include direct diff & comparison deep-links"
    required: false
    default: "false"
  behind_main:
    description: "Include behind-main & conflict risk indicators"
    required: false
    default: "false"
  cleanup_dispatch:
    description: "Include interactive automated cleanup dispatch"
    required: false
    default: "false"
  debug:
    description: "Enable extra diagnostics (verbose gh api call)"
    required: false
    default: "false"

outputs:
  repo_count:
    description: "Total number of repositories processed"
    value: ${{ steps.enumerate.outputs.count }}
  repos_with_improvements:
    description: "Number of repositories with improvement branches"
    value: ${{ steps.process.outputs.improvements_count || '0' }}
  repos_with_prev_improvements:
    description: "Number of repositories with improvement branches from previous months"
    value: ${{ steps.process.outputs.prev_improvements_count || '0' }}
  status:
    description: "Processing status (success/failure/no_repos)"
    value: ${{ steps.process.outputs.status || steps.enumerate.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Validate required inputs
      shell: bash
      run: |
        set -Eeuo pipefail
        if [ -z "${{ inputs.org_name }}" ]; then
          echo "ERROR: org_name input is required" >&2
          exit 1
        fi
        if [ -z "${{ inputs.gh_token }}" ]; then
          echo "ERROR: gh_token input is required" >&2
          exit 1
        fi

    - name: Check GitHub CLI and auth
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      shell: bash
      run: |
        set -Eeuo pipefail
        if ! gh --version >/dev/null 2>&1; then
          echo "ERROR: GitHub CLI 'gh' is not available in PATH" >&2
          exit 1
        fi
        if ! gh auth status -t >/dev/null 2>&1; then
          echo "ERROR: 'gh' authentication not initialized or token invalid" >&2
          echo "Ensure 'gh_token' is a valid token with required scopes." >&2
          exit 1
        fi

        echo "finished step GitHub CLI & auth"

    - name: Bootstrap bash environment (BASH_ENV)
      shell: bash
      run: |
        set -Eeuo pipefail
        ENV_FILE="$RUNNER_TEMP/bash_env"

        cat >"$ENV_FILE" <<'EOF'
        set -Eeuo pipefail
        IFS=$'\n\t'
        # Avoid interactive pagers
        export GIT_PAGER=
        # Reusable logger
        if [ -f "${GITHUB_WORKSPACE}/.github/scripts/logging.sh" ]; then
          # shellcheck source=/dev/null
          source "${GITHUB_WORKSPACE}/.github/scripts/logging.sh"
        else
          log() {
            local level="${1:-INFO}"; shift
            printf "[%s] %s\n" "$level" "$*"
          }
        fi
        EOF
        echo "BASH_ENV=$ENV_FILE" >> "$GITHUB_ENV"
        echo "Created a shared bash init file sourced automatically by all subsequent bash steps"

    - name: Resolve reporting options
      id: options
      shell: bash
      run: |
        set -Eeuo pipefail
        FULL_REPORT="${{ inputs.full_report }}"
        ONLY_OPEN="${{ inputs.report_only_open_prs }}"

        if [ "$FULL_REPORT" = "true" ]; then
          OPT_STALE_AGE=true
          OPT_PR_STATUS=true
          OPT_DIFF_LINKS=true
          OPT_BEHIND_MAIN=true
          OPT_CLEANUP_DISPATCH=true
        else
          OPT_STALE_AGE="${{ inputs.stale_branch_age }}"
          OPT_PR_STATUS="${{ inputs.pr_status }}"
          OPT_DIFF_LINKS="${{ inputs.diff_links }}"
          OPT_BEHIND_MAIN="${{ inputs.behind_main }}"
          OPT_CLEANUP_DISPATCH="${{ inputs.cleanup_dispatch }}"
        fi

        log INFO "Resolved reporting options:"
        log INFO "  full_report=$FULL_REPORT"
        log INFO "  report_only_open_prs=$ONLY_OPEN"
        log INFO "  stale_branch_age=$OPT_STALE_AGE"
        log INFO "  pr_status=$OPT_PR_STATUS"
        log INFO "  diff_links=$OPT_DIFF_LINKS"
        log INFO "  behind_main=$OPT_BEHIND_MAIN"
        log INFO "  cleanup_dispatch=$OPT_CLEANUP_DISPATCH"

        echo "FULL_REPORT=$FULL_REPORT" >> "$GITHUB_ENV"
        echo "OPT_ONLY_OPEN_PRS=$ONLY_OPEN" >> "$GITHUB_ENV"
        echo "OPT_STALE_AGE=$OPT_STALE_AGE" >> "$GITHUB_ENV"
        echo "OPT_PR_STATUS=$OPT_PR_STATUS" >> "$GITHUB_ENV"
        echo "OPT_DIFF_LINKS=$OPT_DIFF_LINKS" >> "$GITHUB_ENV"
        echo "OPT_BEHIND_MAIN=$OPT_BEHIND_MAIN" >> "$GITHUB_ENV"
        echo "OPT_CLEANUP_DISPATCH=$OPT_CLEANUP_DISPATCH" >> "$GITHUB_ENV"

    - name: List repositories
      id: list
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        ORG_NAME: ${{ inputs.org_name }}
      shell: bash
      run: |
        # log is available via BASH_ENV
        log INFO "Listing non-archived repositories for ${ORG_NAME}"
        REPOS=$(gh repo list "$ORG_NAME" --limit 1000 --no-archived --json name --jq '.[].name')
        # Write raw list (may include empty if org has zero)
        printf "%s\n" "$REPOS" > "$RUNNER_TEMP/repos_all.txt"
        ALL_COUNT=$(sed '/^\s*$/d' "$RUNNER_TEMP/repos_all.txt" | wc -l | tr -d ' ')
        log INFO "Total repositories returned: ${ALL_COUNT}"
        echo "all_count=${ALL_COUNT}" >> "$GITHUB_OUTPUT"

    - name: Enumerate selection (apply filter and set outputs)
      id: enumerate
      env:
        ORG_NAME: ${{ inputs.org_name }}
        REPO_FILTER: ${{ inputs.repo_filter }}
      shell: bash
      run: |
        set -Eeuo pipefail
        : > "$RUNNER_TEMP/repos.txt"
        if [ -s "$RUNNER_TEMP/repos_all.txt" ]; then
          if [ -n "${REPO_FILTER:-}" ]; then
            log INFO "Applying repo filter: ${REPO_FILTER}"
            # Write grep results to repos.txt regardless of match results; avoid option parsing with leading '-'
            if ! grep -i -- "${REPO_FILTER}" "$RUNNER_TEMP/repos_all.txt" > "$RUNNER_TEMP/repos.txt"; then
              true # allow no matches without failing the step
            fi
          else
            cp "$RUNNER_TEMP/repos_all.txt" "$RUNNER_TEMP/repos.txt"
          fi
        fi
        COUNT=$(sed '/^\s*$/d' "$RUNNER_TEMP/repos.txt" | wc -l | tr -d ' ')
        log INFO "Selected repository count: ${COUNT}"
        echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

        if [ "$COUNT" -eq 0 ]; then
          log WARN "No repositories matched the selection."
          echo "status=no_repos" >> "$GITHUB_OUTPUT"
        else
          echo "status=has_repos" >> "$GITHUB_OUTPUT"
        fi
        log INFO "finished step Enumerate selection"

    - name: Initialize metrics when no repos
      id: init_metrics
      if: steps.enumerate.outputs.status == 'no_repos'
      shell: bash
      run: |
        echo "improvements_count=0" >> "$GITHUB_OUTPUT"
        echo "prev_improvements_count=0" >> "$GITHUB_OUTPUT"
        echo "status=no_repos" >> "$GITHUB_OUTPUT"
        log INFO "Initialized metrics for empty selection (no_repos)"

    - name: Process repos - Phase 1 - Collect repository metadata
      id: phase1_metadata
      if: steps.enumerate.outputs.status == 'has_repos'
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        ORG_NAME: ${{ inputs.org_name }}
      shell: bash
      run: |
        set -Eeuo pipefail
        REPOS_PROCESSED=0

        log INFO "Phase 1: Starting repository metadata collection"
        METADATA_FILE="$RUNNER_TEMP/repos_metadata.txt"
        : > "$METADATA_FILE"

        while IFS= read -r REPO; do
          [ -z "$REPO" ] && continue
          # FIX: Replaced post-increment to prevent exit code 1 when value is 0
          REPOS_PROCESSED=$((REPOS_PROCESSED + 1))
          log INFO "Phase 1: Processing repository #${REPOS_PROCESSED}: ${REPO}"

          log DEBUG "Phase 1: Fetching metadata for ${REPO}"
          DEFAULT_BRANCH=$(gh api "repos/${ORG_NAME}/${REPO}" --jq '.default_branch' 2>/dev/null || echo "")
          
          if [ -z "$DEFAULT_BRANCH" ]; then
            log ERROR "Phase 1: Failed to fetch default branch for ${REPO}. Skipping."
            continue
          fi

          VISIBILITY=$(gh api "repos/${ORG_NAME}/${REPO}" --jq '.visibility' 2>/dev/null || echo "")
          log INFO "Phase 1: Repository ${REPO} - branch=${DEFAULT_BRANCH} visibility=${VISIBILITY}"

          if [ "$DEFAULT_BRANCH" != "main" ]; then
            log WARN "Phase 1: Repository ${REPO} uses non-standard default branch: ${DEFAULT_BRANCH}"
          fi

          echo "${REPO}|${DEFAULT_BRANCH}|${VISIBILITY}" >> "$METADATA_FILE"
        done < "$RUNNER_TEMP/repos.txt"

        log INFO "Phase 1 completed: ${REPOS_PROCESSED} repositories processed"
        echo "repos_processed=${REPOS_PROCESSED}" >> "$GITHUB_OUTPUT"

    - name: Process repos - Phase 2 - Fetch branches and filter improvements
      id: phase2_branches
      if: steps.enumerate.outputs.status == 'has_repos'
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        ORG_NAME: ${{ inputs.org_name }}
        BRANCH_PATTERN: ${{ inputs.branch_pattern }}
      shell: bash
      run: |
        set -Eeuo pipefail
        REPOS_CHECKED=0
        REPOS_WITH_IMPROVEMENTS=0

        log INFO "Phase 2: Starting branch filtering"
        BRANCHES_FILE="$RUNNER_TEMP/improvement_branches.txt"
        : > "$BRANCHES_FILE"
        PREV_MONTH_REPOS_FILE="$RUNNER_TEMP/prev_month_improvement_repos.txt"
        : > "$PREV_MONTH_REPOS_FILE"
        CURRENT_YM=$(date +%Y-%m)

        while IFS='|' read -r REPO DEFAULT_BRANCH VISIBILITY; do
          [ -z "$REPO" ] && continue
          REPOS_CHECKED=$((REPOS_CHECKED + 1))
          log DEBUG "Phase 2: Fetching branches for ${REPO}"

          ALL_BRANCHES=$(gh api "repos/${ORG_NAME}/${REPO}/branches?per_page=100" --paginate --jq '.[].name' 2>/dev/null || echo "")
          BRANCH_COUNT=$(printf "%s\n" "$ALL_BRANCHES" | sed '/^\s*$/d' | wc -l | tr -d ' ')
          log INFO "Phase 2: Repository ${REPO} has ${BRANCH_COUNT} total branches"

          if [ -n "${BRANCH_PATTERN:-}" ]; then
            IMPROVEMENT_BRANCHES=$(printf "%s\n" "$ALL_BRANCHES" | grep -E -- "${BRANCH_PATTERN}" || true)
          else
            IMPROVEMENT_BRANCHES=""
          fi

          if [ -z "$IMPROVEMENT_BRANCHES" ]; then
            log DEBUG "Phase 2: No improvement branches found in ${REPO} for pattern: ${BRANCH_PATTERN}"
          else
            REPO_HAS_IMPROVEMENTS=false
            while read -r BR; do
              [ -z "$BR" ] && continue

              # If report_only_open_prs is active, skip branches without an open PR
              if [ "${OPT_ONLY_OPEN_PRS:-false}" = "true" ]; then
                OPEN_PR_NUM=$(gh pr list -R "${ORG_NAME}/${REPO}" -H "${BR}" --state open --limit 1 --json number --jq '.[0].number' 2>/dev/null || echo "")
                if [ -z "$OPEN_PR_NUM" ]; then
                  log DEBUG "Phase 2: Skipping ${BR} in ${REPO} (report_only_open_prs is active and no open PR exists)"
                  continue
                fi
              fi

              if [ "$REPO_HAS_IMPROVEMENTS" = false ]; then
                REPOS_WITH_IMPROVEMENTS=$((REPOS_WITH_IMPROVEMENTS + 1))
                REPO_HAS_IMPROVEMENTS=true
                log INFO "Phase 2: Repository ${REPO} has qualifying improvement branches"
              fi

              echo "${REPO}|${DEFAULT_BRANCH}|${VISIBILITY}|${BR}" >> "$BRANCHES_FILE"

              # Check if branch is from a previous month
              IS_PREV_MONTH=false
              if [[ "$BR" =~ ^([0-9]{4}-[0-9]{2})- ]]; then
                BRANCH_YM="${BASH_REMATCH[1]}"
                if [[ "$BRANCH_YM" < "$CURRENT_YM" ]]; then
                  IS_PREV_MONTH=true
                fi
              else
                COMMIT_DATE=$(gh api "repos/${ORG_NAME}/${REPO}/branches/${BR}" --jq '.commit.commit.committer.date' 2>/dev/null || echo "")
                if [ -n "$COMMIT_DATE" ] && [[ "${COMMIT_DATE:0:7}" < "$CURRENT_YM" ]]; then
                  IS_PREV_MONTH=true
                fi
              fi

              if [ "$IS_PREV_MONTH" = true ]; then
                log INFO "Phase 2: Improvement branch ${BR} in ${REPO} is from a previous month"
                echo "${REPO}" >> "$PREV_MONTH_REPOS_FILE"
              fi
            done < <(printf "%s\n" "$IMPROVEMENT_BRANCHES" | sort -r)
          fi
        done < "$RUNNER_TEMP/repos_metadata.txt"

        if [ -s "$PREV_MONTH_REPOS_FILE" ]; then
          sort --unique --output="$PREV_MONTH_REPOS_FILE" "$PREV_MONTH_REPOS_FILE"
          PREV_IMP_COUNT=$(sed '/^\s*$/d' "$PREV_MONTH_REPOS_FILE" | wc -l | tr -d ' ')
        else
          PREV_IMP_COUNT=0
        fi

        echo "repos_with_improvements=${REPOS_WITH_IMPROVEMENTS}" >> "$GITHUB_OUTPUT"
        echo "repos_with_prev_improvements=${PREV_IMP_COUNT}" >> "$GITHUB_OUTPUT"
        log INFO "Phase 2 completed: ${REPOS_CHECKED} repos checked, ${REPOS_WITH_IMPROVEMENTS} with improvements, ${PREV_IMP_COUNT} with previous months improvements"

    - name: Process repos - Phase 3 - Analyze branch comparisons
      id: phase3_comparisons
      if: steps.phase2_branches.outputs.repos_with_improvements != '0'
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        ORG_NAME: ${{ inputs.org_name }}
      shell: bash
      run: |
        set -Eeuo pipefail
        BRANCHES_ANALYZED=0

        log INFO "Phase 3: Starting branch comparison analysis"
        COMPARISON_FILE="$RUNNER_TEMP/branch_comparisons.txt"
        : > "$COMPARISON_FILE"
        DETAILS_FILE="$RUNNER_TEMP/branch_details.txt"
        : > "$DETAILS_FILE"
        CLEANUP_FILE="$RUNNER_TEMP/cleanup_candidates.txt"
        : > "$CLEANUP_FILE"

        while IFS='|' read -r REPO DEFAULT_BRANCH VISIBILITY BR; do
          [ -z "$REPO" ] && continue
          BRANCHES_ANALYZED=$((BRANCHES_ANALYZED + 1))
          
          log DEBUG "Phase 3: Analyzing branch ${BR} in ${REPO}"
          AHEAD_BY=$(gh api "repos/${ORG_NAME}/${REPO}/compare/${DEFAULT_BRANCH}...${BR}" --jq '.ahead_by' 2>/dev/null || echo "0")
          BEHIND_BY=$(gh api "repos/${ORG_NAME}/${REPO}/compare/${DEFAULT_BRANCH}...${BR}" --jq '.behind_by' 2>/dev/null || echo "0")
          
          log INFO "Phase 3: Branch comparison - repo=${REPO} base=${DEFAULT_BRANCH} branch=${BR} ahead=${AHEAD_BY} behind=${BEHIND_BY}"
          echo "${REPO}|${DEFAULT_BRANCH}|${VISIBILITY}|${BR}|${AHEAD_BY}|${BEHIND_BY}" >> "$COMPARISON_FILE"

          # 1. Stale Branch Age Tracking
          AGE_TEXT=""
          if [ "${OPT_STALE_AGE:-false}" = "true" ]; then
            COMMIT_DATE=$(gh api "repos/${ORG_NAME}/${REPO}/branches/${BR}" --jq '.commit.commit.committer.date' 2>/dev/null || echo "")
            if [ -n "$COMMIT_DATE" ]; then
              COMMIT_TS=$(date -d "$COMMIT_DATE" +%s 2>/dev/null || echo "")
              if [ -n "$COMMIT_TS" ]; then
                NOW_TS=$(date +%s)
                DAYS_OLD=$(( (NOW_TS - COMMIT_TS) / 86400 ))
                AGE_TEXT="${DAYS_OLD}d ago"
              fi
            fi
            [ -z "$AGE_TEXT" ] && AGE_TEXT="age unknown"
          fi

          # 2. PR Status & Direct Links
          PR_TEXT=""
          PR_STATE=""
          if [ "${OPT_PR_STATUS:-false}" = "true" ] || [ "${OPT_CLEANUP_DISPATCH:-false}" = "true" ]; then
            PR_JSON=$(gh pr list -R "${ORG_NAME}/${REPO}" -H "${BR}" --state all --limit 1 --json number,state,url --jq '.[0]' 2>/dev/null || echo "")
            if [ -n "$PR_JSON" ] && [ "$PR_JSON" != "null" ]; then
              PR_NUM=$(echo "$PR_JSON" | jq -r '.number // ""')
              PR_STATE=$(echo "$PR_JSON" | jq -r '.state // ""')
              PR_URL=$(echo "$PR_JSON" | jq -r '.url // ""')
              PR_TEXT="PR [#${PR_NUM}](${PR_URL}) (${PR_STATE})"
            else
              PR_TEXT="No PR"
            fi
          fi

          # 3. Direct Diff & Comparison Deep-Links
          DIFF_TEXT=""
          if [ "${OPT_DIFF_LINKS:-false}" = "true" ]; then
            DIFF_TEXT="[Compare](https://github.com/${ORG_NAME}/${REPO}/compare/${DEFAULT_BRANCH}...${BR})"
          fi

          # 4. Behind-Main & Conflict Risk Indicators
          BEHIND_TEXT=""
          if [ "${OPT_BEHIND_MAIN:-false}" = "true" ]; then
            if [ "${BEHIND_BY:-0}" -gt 10 ]; then
              BEHIND_TEXT="⚠️ Behind main by ${BEHIND_BY} (${AHEAD_BY} ahead)"
            else
              BEHIND_TEXT="${AHEAD_BY} ahead, ${BEHIND_BY} behind"
            fi
          fi

          # 5. Interactive Automated Cleanup Dispatch Candidate
          if [ "${OPT_CLEANUP_DISPATCH:-false}" = "true" ]; then
            if [ "${AHEAD_BY:-0}" -eq 0 ] || [ "$PR_STATE" = "MERGED" ]; then
              echo "${REPO}|${BR}|${AHEAD_BY}|${PR_STATE}" >> "$CLEANUP_FILE"
            fi
          fi

          echo "${REPO}|${BR}|${AGE_TEXT}|${PR_TEXT}|${DIFF_TEXT}|${BEHIND_TEXT}" >> "$DETAILS_FILE"
        done < "$RUNNER_TEMP/improvement_branches.txt"

        echo "branches_analyzed=${BRANCHES_ANALYZED}" >> "$GITHUB_OUTPUT"
        log INFO "Phase 3 completed: total ${BRANCHES_ANALYZED} github branches analyzed"

    - name: Process repos - Phase 4 - Collect merge history
      id: phase4_merges
      if: steps.enumerate.outputs.status == 'has_repos'
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        ORG_NAME: ${{ inputs.org_name }}
      shell: bash
      run: |
        set -Eeuo pipefail
        REPOS_MERGED_CHECKED=0

        log INFO "Phase 4: Starting merge history collection"
        MERGE_FILE="$RUNNER_TEMP/merge_history.txt"
        : > "$MERGE_FILE"

        while IFS='|' read -r REPO DEFAULT_BRANCH VISIBILITY; do
          [ -z "$REPO" ] && continue
          REPOS_MERGED_CHECKED=$((REPOS_MERGED_CHECKED + 1))

          log DEBUG "Phase 4: Fetching merge history for ${REPO}"
          LAST_MERGED=$(gh pr list -R "${ORG_NAME}/${REPO}" --state merged --base "$DEFAULT_BRANCH" --limit 1 --json mergedAt --jq '.[0].mergedAt' 2>/dev/null || echo "")
          
          if [ -z "$LAST_MERGED" ]; then
            log INFO "Phase 4: No merged PRs found for ${REPO} into ${DEFAULT_BRANCH}"
            LAST_MERGED="none"
          else
            log INFO "Phase 4: Last merged PR for ${REPO}: ${LAST_MERGED}"
          fi

          echo "${REPO}|${LAST_MERGED}" >> "$MERGE_FILE"
        done < "$RUNNER_TEMP/repos_metadata.txt"
        
        echo "repos_checked=${REPOS_MERGED_CHECKED}" >> "$GITHUB_OUTPUT"
        log INFO "Phase 4 completed: ${REPOS_MERGED_CHECKED} repositories checked for merge history"

    - name: Process repos - Phase 5 - Aggregate results generate reports
      id: process
      if: steps.enumerate.outputs.status == 'has_repos'
      shell: bash
      run: |
        set -Eeuo pipefail

        log INFO "Phase 5: Starting results aggregation"

        REPOS_PROCESSED=${{ steps.phase1_metadata.outputs.repos_processed || '0' }}
        REPOS_WITH_IMPROVEMENTS=${{ steps.phase2_branches.outputs.repos_with_improvements || '0' }}
        REPOS_WITH_PREV=${{ steps.phase2_branches.outputs.repos_with_prev_improvements || '0' }}
        BRANCHES_ANALYZED=${{ steps.phase3_comparisons.outputs.branches_analyzed || '0' }}

        log INFO "Phase 5: Preparing comprehensive summary"
        log INFO "Phase 5: Total repositories processed: ${REPOS_PROCESSED}"
        log INFO "Phase 5: Repositories with improvements: ${REPOS_WITH_IMPROVEMENTS}"
        log INFO "Phase 5: Repositories with previous month improvements: ${REPOS_WITH_PREV}"
        log INFO "Phase 5: Branches analyzed: ${BRANCHES_ANALYZED}"

        if [ -f "$RUNNER_TEMP/branch_comparisons.txt" ]; then
          log DEBUG "Phase 5: Generating comparison details report"
          while IFS='|' read -r REPO DEFAULT_BRANCH VISIBILITY BR AHEAD BEHIND; do
            [ -z "$REPO" ] && continue
            echo "::group::Report for ${REPO}/${BR}"
            log INFO "Comparison: repo=${REPO} base=${DEFAULT_BRANCH} branch=${BR} ahead=${AHEAD} behind=${BEHIND}"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/branch_comparisons.txt"
        fi

        log INFO "Phase 5: Compiling final outputs"
        echo "improvements_count=${REPOS_WITH_IMPROVEMENTS}" >> "$GITHUB_OUTPUT"
        echo "prev_improvements_count=${REPOS_WITH_PREV}" >> "$GITHUB_OUTPUT"
        echo "status=success" >> "$GITHUB_OUTPUT"
        log INFO "Phase 5 completed: Results aggregation finished"
        log INFO "Processing workflow completed successfully"

    - name: Summary with Github repos
      if: steps.enumerate.outputs.status == 'has_repos'
      env:
        ORG_NAME: ${{ inputs.org_name }}
      shell: bash
      run: |
        COUNT="${{ steps.enumerate.outputs.count }}"
        IMP="${{ steps.process.outputs.improvements_count }}"
        CURRENT_MONTH=$(LC_ALL=C date +"%B %Y")
        PREV_REPOS_FILE="$RUNNER_TEMP/prev_month_improvement_repos.txt"
        DETAILS_FILE="$RUNNER_TEMP/branch_details.txt"
        CLEANUP_FILE="$RUNNER_TEMP/cleanup_candidates.txt"

        ACTIVE_OPTIONS=()
        [ "${FULL_REPORT:-false}" = "true" ] && ACTIVE_OPTIONS+=("Full report")
        [ "${OPT_ONLY_OPEN_PRS:-false}" = "true" ] && ACTIVE_OPTIONS+=("Report only Open PRs")
        [ "${OPT_STALE_AGE:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("Stale Branch Age Tracking")
        [ "${OPT_PR_STATUS:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("PR Status & Direct Links")
        [ "${OPT_DIFF_LINKS:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("Direct Diff & Comparison Deep-Links")
        [ "${OPT_BEHIND_MAIN:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("Behind-Main & Conflict Risk Indicators")
        [ "${OPT_CLEANUP_DISPATCH:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("Interactive Automated Cleanup Dispatch")

        OPTIONS_STR=""
        if [ ${#ACTIVE_OPTIONS[@]} -eq 0 ]; then
          OPTIONS_STR="Standard report"
        else
          OPTIONS_STR=$(IFS=', '; echo "${ACTIVE_OPTIONS[*]}")
        fi

        HAS_ENRICHED=false
        if [ "${OPT_STALE_AGE:-false}" = "true" ] || [ "${OPT_PR_STATUS:-false}" = "true" ] || [ "${OPT_DIFF_LINKS:-false}" = "true" ] || [ "${OPT_BEHIND_MAIN:-false}" = "true" ]; then
          HAS_ENRICHED=true
        fi

        {
          echo "### www.andres.nz Github Repos summary"
          echo ""
          echo "- Org: ${ORG_NAME}"
          echo "- Selected repos: ${COUNT}"
          echo "- Repos with improvement branches: ${IMP}"
          echo "- Reporting tweaks: ${OPTIONS_STR}"
          echo ""
          echo "### Repos with improvement branches from previous months"
          echo ""
          echo "Current month: ${CURRENT_MONTH}"
          echo ""
          if [ -s "$PREV_REPOS_FILE" ]; then
            INDEX=1
            while IFS= read -r REPO; do
              [ -z "$REPO" ] && continue
              echo "${INDEX}. [${REPO}](https://github.com/${ORG_NAME}/${REPO})"
              INDEX=$((INDEX + 1))

              if [ "$HAS_ENRICHED" = true ] && [ -f "$DETAILS_FILE" ]; then
                while IFS='|' read -r D_REPO D_BR D_AGE D_PR D_DIFF D_BEHIND; do
                  [ "$D_REPO" != "$REPO" ] && continue
                  TAGS=()
                  [ -n "$D_AGE" ] && TAGS+=("$D_AGE")
                  [ -n "$D_PR" ] && TAGS+=("$D_PR")
                  [ -n "$D_DIFF" ] && TAGS+=("$D_DIFF")
                  [ -n "$D_BEHIND" ] && TAGS+=("$D_BEHIND")

                  TAG_LINE=""
                  if [ ${#TAGS[@]} -gt 0 ]; then
                    TAG_LINE=" ("$(IFS=' | '; echo "${TAGS[*]}")")"
                  fi
                  echo "   - \`${D_BR}\`${TAG_LINE}"
                done < "$DETAILS_FILE"
              fi
            done < "$PREV_REPOS_FILE"
          else
            echo "No repositories found with improvement branches from previous months."
          fi

          if [ "${OPT_CLEANUP_DISPATCH:-false}" = "true" ]; then
            echo ""
            echo "### Interactive Automated Cleanup Dispatch"
            echo ""
            if [ -s "$CLEANUP_FILE" ]; then
              echo "The following branches have 0 commits ahead or are already merged and can safely be deleted:"
              echo ""
              while IFS='|' read -r C_REPO C_BR C_AHEAD C_STATE; do
                [ -z "$C_REPO" ] && continue
                REASON="0 ahead"
                [ "$C_STATE" = "MERGED" ] && REASON="merged"
                echo "- **${C_REPO}**: \`${C_BR}\` (${REASON})"
                echo "  \`\`\`bash"
                echo "  gh api --method DELETE repos/${ORG_NAME}/${C_REPO}/git/refs/heads/${C_BR}"
                echo "  \`\`\`"
              done < "$CLEANUP_FILE"
            else
              echo "_No branches eligible for cleanup at this time._"
            fi
          fi

          echo ""
          echo "## Future Work"
          echo ""
          echo "1. **Stale Branch Age Tracking**: Calculate and display days elapsed since the last commit on each improvement branch to highlight abandoned branches."
          echo "2. **Automated PR Status & Direct Links**: Check if an open PR exists for each improvement branch with direct links and status indicators."
          echo "3. **Direct Diff & Comparison Deep-Links**: Include one-click GitHub comparison links (\`main...branch\`) for swift diff inspection."
          echo "4. **Behind-Main & Conflict Risk Indicators**: Flag branches that are significantly behind the default branch (e.g. \`behind_by > 10\`) to preempt merge conflicts."
          echo "5. **Multi-Channel Notifications**: Support sending the generated report via webhook to Slack, Microsoft Teams, or Discord."
          echo "6. **Report Artifact Export (JSON/CSV)**: Export raw and aggregated metrics as downloadable workflow artifacts for historical tracking and trend analysis."
          echo "7. **Interactive Automated Cleanup Dispatch**: Provide a workflow dispatch option to safely delete fully merged or obsolete improvement branches."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Summary No repos
      if: steps.enumerate.outputs.status == 'no_repos'
      env:
        ORG_NAME: ${{ inputs.org_name }}
      shell: bash
      run: |
        CURRENT_MONTH=$(LC_ALL=C date +"%B %Y")
        ACTIVE_OPTIONS=()
        [ "${FULL_REPORT:-false}" = "true" ] && ACTIVE_OPTIONS+=("Full report")
        [ "${OPT_ONLY_OPEN_PRS:-false}" = "true" ] && ACTIVE_OPTIONS+=("Report only Open PRs")
        [ "${OPT_STALE_AGE:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("Stale Branch Age Tracking")
        [ "${OPT_PR_STATUS:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("PR Status & Direct Links")
        [ "${OPT_DIFF_LINKS:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("Direct Diff & Comparison Deep-Links")
        [ "${OPT_BEHIND_MAIN:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("Behind-Main & Conflict Risk Indicators")
        [ "${OPT_CLEANUP_DISPATCH:-false}" = "true" ] && [ "${FULL_REPORT:-false}" != "true" ] && ACTIVE_OPTIONS+=("Interactive Automated Cleanup Dispatch")

        OPTIONS_STR=""
        if [ ${#ACTIVE_OPTIONS[@]} -eq 0 ]; then
          OPTIONS_STR="Standard report"
        else
          OPTIONS_STR=$(IFS=', '; echo "${ACTIVE_OPTIONS[*]}")
        fi

        {
          echo "### www.andres.nz Github Repos summary"
          echo ""
          echo "- Org: ${ORG_NAME}"
          echo "- No repositories matched the selection."
          echo "- Reporting tweaks: ${OPTIONS_STR}"
          echo ""
          echo "### Repos with improvement branches from previous months"
          echo ""
          echo "Current month: ${CURRENT_MONTH}"
          echo ""
          echo "No repositories matched the selection."
          echo ""
          echo "## Future Work"
          echo ""
          echo "1. **Stale Branch Age Tracking**: Calculate and display days elapsed since the last commit on each improvement branch to highlight abandoned branches."
          echo "2. **Automated PR Status & Direct Links**: Check if an open PR exists for each improvement branch with direct links and status indicators."
          echo "3. **Direct Diff & Comparison Deep-Links**: Include one-click GitHub comparison links (\`main...branch\`) for swift diff inspection."
          echo "4. **Behind-Main & Conflict Risk Indicators**: Flag branches that are significantly behind the default branch (e.g. \`behind_by > 10\`) to preempt merge conflicts."
          echo "5. **Multi-Channel Notifications**: Support sending the generated report via webhook to Slack, Microsoft Teams, or Discord."
          echo "6. **Report Artifact Export (JSON/CSV)**: Export raw and aggregated metrics as downloadable workflow artifacts for historical tracking and trend analysis."
          echo "7. **Interactive Automated Cleanup Dispatch**: Provide a workflow dispatch option to safely delete fully merged or obsolete improvement branches."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Diagnostics (optional, read-only)
      if: ${{ inputs.debug == 'true' }}
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      shell: bash
      run: |
        echo "================= GitHub REST API docs: https://docs.github.com/en/rest"
        gh api --verbose "repos/${GITHUB_REPOSITORY}/branches" || echo "Verbose output unavailable"
        echo "================= completed verbose API call for branch diagnostics repo ${GITHUB_REPOSITORY}"
