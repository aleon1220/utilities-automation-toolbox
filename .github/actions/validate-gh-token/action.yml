name: Validate GitHub Token
description: Validates GitHub CLI authentication and the token's access to the target user or org

inputs:
  gh_token:
    description: GitHub token for authentication
    required: true
  owner:
    description: User or org the token must be able to read (defaults to this repo's owner)
    required: false
    default: ""

outputs:
  authenticated:
    description: Whether the token is properly authenticated
    value: ${{ steps.validate.outputs.authenticated }}
  token_owner:
    description: The owner/user associated with the token
    value: ${{ steps.validate.outputs.token_owner }}
  token_scopes:
    description: The scopes associated with the token
    value: ${{ steps.validate.outputs.token_scopes }}
  permissions_valid:
    description: required token permissions are present
    value: ${{ steps.validate_permissions.outputs.permissions_valid }}

runs:
  using: composite
  steps:
    - name: Validate GitHub Token
      id: validate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      run: |
        set -e

        echo "::group::Validating GitHub Token"

        # Check if token is set
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::GitHub token is empty or not provided"
          echo "authenticated=false" >> $GITHUB_OUTPUT
          exit 1
        fi

        # Attempt authentication
        if ! gh auth status > /tmp/auth_status.txt 2>&1; then
          echo "::error::GitHub CLI authentication failed"
          cat /tmp/auth_status.txt
          echo "authenticated=false" >> $GITHUB_OUTPUT
          exit 1
        fi

        echo "::notice::✓ GitHub CLI authentication successful"
        echo "authenticated=true" >> $GITHUB_OUTPUT

        TOKEN_OWNER=$(gh api user --jq '.login' 2>/dev/null || echo "unknown")
        echo "token_owner=$TOKEN_OWNER" >> $GITHUB_OUTPUT

        # Classic PATs and OAuth tokens list their scopes in this header; fine-grained and app tokens don't
        TOKEN_SCOPES=$(gh api -i user 2>/dev/null | tr -d '\r' | sed -n 's/^[Xx]-[Oo][Aa]uth-[Ss]copes: *//p')
        echo "token_scopes=${TOKEN_SCOPES:-not listed (fine-grained or GitHub App token)}" >> $GITHUB_OUTPUT

        echo "Token user:   ${TOKEN_OWNER}"
        echo "Token scopes: ${TOKEN_SCOPES:-not listed (fine-grained or GitHub App token)}"
        echo "::endgroup::"

    - name: Validate Token Permissions
      id: validate_permissions
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        OWNER: ${{ inputs.owner || github.repository_owner }}
        THIS_REPO: ${{ github.repository }}
        TOKEN_OWNER: ${{ steps.validate.outputs.token_owner }}
        TOKEN_SCOPES: ${{ steps.validate.outputs.token_scopes }}
      run: |
        set -uo pipefail

        echo "::group::Validating token access to ${OWNER}"
        PROBLEMS=()

        OWNER_TYPE=$(gh api "users/${OWNER}" --jq '.type' 2>/dev/null || echo "")
        echo "Target: ${OWNER} (${OWNER_TYPE:-not found})"
        if [ -z "$OWNER_TYPE" ]; then
          PROBLEMS+=("'${OWNER}' was not found or is not visible to ${TOKEN_OWNER}")
        fi

        # Classic tokens: check the scopes the reporter needs. Orgs also need read:org.
        if [[ "$TOKEN_SCOPES" != not\ listed* ]]; then
          REQUIRED_SCOPES=("repo" "workflow")
          [ "$OWNER_TYPE" = "Organization" ] && REQUIRED_SCOPES+=("read:org")
          for SCOPE in "${REQUIRED_SCOPES[@]}"; do
            if [[ ", ${TOKEN_SCOPES}, " != *", ${SCOPE}, "* ]] && \
               ! { [ "$SCOPE" = "read:org" ] && [[ ", ${TOKEN_SCOPES}, " == *", admin:org, "* ]]; }; then
              PROBLEMS+=("token is missing the '${SCOPE}' scope")
            fi
          done
        fi

        # Orgs: private repos are only visible to members
        if [ "$OWNER_TYPE" = "Organization" ]; then
          STATE=$(gh api "user/memberships/orgs/${OWNER}" --jq '.state' 2>/dev/null || echo "")
          if [ "$STATE" = "active" ]; then
            echo "Org membership: ${TOKEN_OWNER} is an active member of ${OWNER}"
          else
            PROBLEMS+=("${TOKEN_OWNER} is not an active member of org '${OWNER}' (or the token can't read memberships), so only public repos are visible")
          fi
        fi

        # What the token can actually see
        VISIBLE=$(gh repo list "$OWNER" --limit 1000 --no-archived --json visibility \
          --jq 'group_by(.visibility) | map("\(length) \(.[0].visibility | ascii_downcase)") | join(", ")' 2>/dev/null || echo "")
        echo "Visible non-archived repos in ${OWNER}: ${VISIBLE:-none}"
        if [ -z "$VISIBLE" ]; then
          PROBLEMS+=("no repositories in '${OWNER}' are visible to the token")
        fi

        if ! gh api "repos/${THIS_REPO}/actions/runs?per_page=1" --silent 2>/dev/null; then
          PROBLEMS+=("token can't read workflow runs in ${THIS_REPO}")
        fi
        echo "::endgroup::"

        if [ ${#PROBLEMS[@]} -gt 0 ]; then
          for P in "${PROBLEMS[@]}"; do
            echo "::warning::Token check: ${P}"
          done
          echo "::warning::See .github/readme.md (Token and access) for how to fix token access"
          echo "permissions_valid=false" >> $GITHUB_OUTPUT
        else
          echo "::notice::✓ Token for ${TOKEN_OWNER} can read ${OWNER} (${VISIBLE})"
          echo "permissions_valid=true" >> $GITHUB_OUTPUT
        fi
